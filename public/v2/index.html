<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行日誌 · Travel Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Caveat:wght@500;600;700&family=Inter+Tight:wght@500;600;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.7.0/style.css" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  :root{
    --parchment:#EAE4D6; --parchment-lo:#DAD2C1; --paper:#F5F2EB; --appbg:#E6E1D4;
    --gold:#CBB781; --gold-deep:#AC9A63;
    --purple:#8A7A9C; --purple-deep:#6C5C80;
    --teal:#5B968A; --teal-deep:#457C71;
    --lavender:#C6BDCE; --dusty:#A69CAF; --dusty-deep:#82778E;
    --sage:#8E9E77; --sage-deep:#6C7B54;
    --sky-cream:#E8E3D4; --sky-lav:#C4D4D9; --sky-top:#B1C6CE;
    --sea:#5A8494; --sea-lo:#6E97A6;
    --brown:#7C6349; --brown-lo:#96795C;
    --rust:#C67B65; --rust-lo:#D3927E; --red:#BE6754;
    --ink:#3B3745; --ink-soft:#7A7382; --cream:#F5F2EB;
    --line:#DED5C1; --ivory:#FCF8EC;
    --f-en:'Space Grotesk'; --f-hand:'Space Grotesk'; --f-num:'Space Grotesk';
  }
  /* ===== JOURNAL SKIN (old hand-drawn paper look) ===== */
  .app[data-skin="journal"]{
    --parchment:#FAFAF7; --parchment-lo:#F0EFE9; --paper:#FFFFFF; --appbg:#FFFFFF;
    --gold:#5A7FB0; --gold-deep:#48688F;
    --purple:#6B5B7A; --purple-deep:#544665;
    --teal:#4F6E5B; --teal-deep:#3D5748;
    --sage:#6B7A3F; --sage-deep:#556030;
    --rust:#C44536; --rust-lo:#D25A4A; --red:#C44536;
    --ink:#1F1A14; --ink-soft:#5C5247; --cream:#FFFFFF;
    --line:#D4D4D4; --ivory:#FEFEFC;
    --f-en:'Caveat'; --f-hand:'Caveat'; --f-num:'Inter Tight';
  }
  /* dates & counts stay clean (legible) */
  .app[data-skin="journal"] .calnav .rg,.app[data-skin="journal"] .m h4,.app[data-skin="journal"] .dow,.app[data-skin="journal"] .d,.app[data-skin="journal"] .clist .c .ct{font-family:'Inter Tight','Noto Sans TC',sans-serif}
  /* all english + numeric titles → handwriting */
  .app[data-skin="journal"] .yswitch .cur,.app[data-skin="journal"] .recapteaser .stat .n,.app[data-skin="journal"] .rstat .n{font-family:'Caveat',cursive;font-weight:700}
  .app[data-skin="journal"] .fld>label,.app[data-skin="journal"] .miss .lbl,.app[data-skin="journal"] .loading{font-family:'Caveat',cursive;font-style:italic}
  .app[data-skin="journal"] .hero{background:#FBFBF8}
  .app[data-skin="journal"] .hero::after{display:none}
  .app[data-skin="journal"] .sh .r,.app[data-skin="journal"] .calnav .rg{}
  .app[data-skin="journal"] .sh .r{background:none;border-top:1.5px dashed var(--line);height:0}
  .app[data-skin="journal"] .m{background:#FAFAF7;border:1px dashed #E2E2DC}
  .app[data-skin="journal"] .foot{border-top:1px dashed var(--line)}
  .app[data-skin="journal"] .hcard .lead,.app[data-skin="journal"] .topbar .sub,.app[data-skin="journal"] .sh .e{font-style:italic}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--appbg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  .en{font-family:var(--f-en),sans-serif}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:var(--parchment-lo);border-radius:4px}

  .app{max-width:960px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:40px}

  /* topbar */
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--parchment);position:sticky;top:0;z-index:20}
  .logom{width:34px;height:34px;flex:none}
  .topbar .zh{font-size:21px;font-weight:900;letter-spacing:-.01em}
  .topbar .sub{font-family:var(--f-en);font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:.08em}
  .yswitch{margin-left:auto;display:flex;align-items:center;gap:8px}
  .yswitch .arw{width:34px;height:34px;background:var(--gold);font-size:17px;font-weight:700;color:var(--ink);border:none;display:flex;align-items:center;justify-content:center}
  .yswitch .arw:hover{background:var(--gold-deep);color:var(--cream)}
  .yswitch .cur{font-family:'Space Grotesk';font-size:19px;font-weight:700;min-width:56px;text-align:center}
  .backbtn{background:var(--parchment-lo);color:var(--ink);border:none;padding:7px 14px;font-weight:700;font-size:13px}

  /* section head */
  .sh{display:flex;align-items:center;gap:9px;margin:22px 20px 12px}
  .sh .zh{font-weight:900;font-size:16px}
  .sh .e{font-family:var(--f-en);font-size:10px;letter-spacing:.16em;color:var(--ink-soft);font-weight:600}
  .sh .r{height:2px;background:var(--line);flex:1}
  .pad{padding:0 20px}

  /* hero : text integrated into the full-bleed illustration */
  .hero{position:relative;overflow:hidden;background:var(--sky-cream);height:clamp(220px,30vw,300px)}
  .hero .scene{position:absolute;inset:0;font-size:0;line-height:0}
  .hero .scene svg{display:block;width:100%;height:100%}
  /* fade the left of the illustration into the background so text stays readable */
  .hero::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#E8E3D4 0%,#E8E3D4 14%,rgba(232,227,212,0) 52%)}
  .hcard{position:absolute;left:0;top:0;z-index:2;padding:clamp(16px,3vw,26px) clamp(18px,3.4vw,32px);max-width:64%}
  .hcard .lead{font-family:var(--f-en);font-weight:700;font-size:clamp(9px,2.1vw,11px);letter-spacing:.12em;color:var(--purple-deep);display:flex;align-items:center;gap:5px}
  .hcard .dest{font-weight:900;font-size:clamp(16px,3.6vw,25px);margin-top:6px;color:var(--ink);line-height:1.14;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .hcard .big{margin-top:3px;line-height:1;display:flex;align-items:baseline;gap:5px;color:var(--ink)}
  .hcard .big b{font-family:var(--f-hand);font-weight:700;font-size:clamp(38px,9vw,66px);color:var(--rust);text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .hero .jart{position:absolute;right:2%;top:0;bottom:0;width:54%;display:flex;align-items:center;justify-content:center;z-index:1}
  .hero .jart svg{width:100%;height:92%}
  .skinopt{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:9px;background:var(--cream);border:2px solid var(--line);text-align:left;cursor:pointer}
  .skinopt[data-on="true"]{border-color:var(--purple);background:var(--parchment-lo)}
  .gear{width:34px;height:34px;background:var(--parchment-lo);border:none;font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
  .gear:hover{background:var(--gold)}
  /* sticker album */
  .album{padding:16px 20px 28px}
  .albumhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .addstk{border:none;background:var(--purple);color:var(--cream);padding:10px 18px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
  .stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:4px}
  /* clean postcard card */
  .stkcard{background:var(--paper);padding:8px 8px 0;position:relative;box-shadow:0 3px 12px rgba(45,40,55,.14);transition:transform .14s,box-shadow .14s}
  .stkcard:hover{transform:translateY(-3px);box-shadow:0 9px 20px rgba(45,40,55,.22)}
  .stkcard img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#e8e4da;cursor:pointer}
  .stkcard .pcap{padding:8px 4px 10px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Caveat','LXGW WenKai TC','Klee One',cursive;font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
  .stkcard .pcap .cdot{width:8px;height:8px;border-radius:50%;flex:none}
  .stkcard .pcap .nm{overflow:hidden;text-overflow:ellipsis}
  .stkcard .del{position:absolute;top:4px;right:4px;background:rgba(30,26,36,.5);color:#fff;border:none;width:22px;height:22px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1;z-index:2}
  .stkempty{text-align:center;color:var(--ink-soft);padding:46px 20px;font-size:14px;line-height:1.9}
  .uploadbox{border:2px dashed var(--line);background:var(--cream);padding:26px;text-align:center;color:var(--ink-soft);cursor:pointer;font-size:13px;font-weight:600;border-radius:4px}
  .uploadprev{width:100%;border-radius:6px;display:block;max-height:230px;object-fit:contain;background:var(--cream)}
  .lightbox{position:fixed;inset:0;background:rgba(30,26,36,.82);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;cursor:zoom-out}
  .lightbox img{max-width:96%;max-height:92vh;border-radius:6px}
  .stkteaser{cursor:pointer}
  .stkstrip{display:flex;gap:12px;overflow:hidden;padding:6px 2px 4px;align-items:flex-start}
  .stkstrip .mini{background:var(--paper);padding:4px 4px 6px;box-shadow:0 2px 7px rgba(45,40,55,.14);flex:none}
  .stkstrip .mini img{width:104px;height:78px;object-fit:cover;display:block}
  .stkteaser-empty{color:var(--ink-soft);font-size:13px;padding:14px 2px;font-weight:600}
  .stkteaser-foot{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .stkteaser-foot .cnt{font-weight:700;font-size:13px}
  .stkteaser-foot .enter{margin-left:auto;font-weight:700;color:var(--purple);font-size:13px}
  .hcard .big small{font-family:'Noto Sans TC';font-size:clamp(12px,2.7vw,17px);font-weight:700;color:var(--ink)}
  .hcard .big .ongoing{font-family:'Noto Sans TC';font-weight:900;font-size:clamp(24px,5.4vw,40px);color:var(--teal-deep)}
  .hcard .meta{font-size:clamp(10px,2.3vw,13px);color:var(--ink);margin-top:7px;font-weight:700}
  .hcard .empty{font-size:clamp(12px,2.8vw,15px);color:var(--ink);font-weight:700;line-height:1.6}

  /* calendar (compact, per-month tint) */
  .calnav{display:flex;align-items:center;justify-content:center;gap:14px;max-width:640px;margin:0 auto 10px}
  .calnav button{width:30px;height:30px;background:var(--parchment-lo);color:var(--ink);border:none;font-size:15px;font-weight:700;border-radius:4px}
  .calnav button:hover{background:var(--gold)}
  .calnav .rg{font-family:'Space Grotesk';font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.03em;min-width:150px;text-align:center}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:640px;margin:0 auto}
  @media(max-width:640px){.months{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:400px){.months{grid-template-columns:1fr}}
  .m{background:rgba(255,255,255,.5);padding:7px 7px 8px;user-select:none;border-radius:5px}
  .m h4{font-family:'Space Grotesk';display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .m h4 .mon{color:var(--purple-deep);font-weight:900;font-size:11px;letter-spacing:.02em;display:flex;align-items:baseline;gap:2px}
  .m h4 .mon b{font-size:14px;font-weight:900}
  .m h4 .mo{color:var(--ink-soft);font-size:9px;font-weight:600}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);font-family:'Space Grotesk';font-size:7px;color:var(--ink-soft);font-weight:600;text-align:center;margin-bottom:2px}
  .dg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .d{position:relative;height:18px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-size:9px;font-weight:500;color:var(--ink);cursor:pointer}
  .d.blank{visibility:hidden;cursor:default}
  .d .ring{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .d.trip .ring{color:var(--cream);font-weight:700}
  .d.today.plain{color:var(--purple);font-weight:800}
  .d.today .ring{outline:1.5px solid var(--purple);outline-offset:0}
  .d.sel .ring{background:var(--gold)!important;color:var(--ink)!important;font-weight:700}
  .caltip{display:flex;align-items:center;justify-content:center;gap:8px;margin:11px 0 2px;font-size:11px;color:var(--ink-soft)}
  .memobubble{position:fixed;z-index:55;transform:translate(-50%,-100%);background:var(--ink);color:var(--cream);padding:8px 12px;border-radius:9px;max-width:230px;font-size:12.5px;line-height:1.5;pointer-events:none;box-shadow:0 5px 16px rgba(40,36,50,.32)}
  .memobubble::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
  .memobubble .mtitle{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif}
  .memobubble .micon{font-size:14px;line-height:1}
  .memobubble .mdates{font-family:'Space Grotesk';font-size:10px;color:#C9C3D4;margin-top:2px;letter-spacing:.02em}
  .memobubble .mtext{white-space:pre-wrap;word-break:break-word;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.15)}

  /* recap teaser */
  .panel{background:var(--parchment);padding:16px}
  .recapteaser{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .recapteaser .stat{flex:1;min-width:74px;text-align:center}
  .recapteaser .stat .n{font-family:'Space Grotesk';font-size:26px;font-weight:700}
  .recapteaser .stat .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .genbtn{border:none;background:var(--teal);color:var(--cream);padding:11px 16px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}

  /* fab */
  .fab{position:fixed;right:calc(50% - 480px + 24px);bottom:26px;background:var(--rust);color:var(--cream);border:none;padding:13px 20px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(59,55,69,.25);z-index:15;border-radius:2px}
  @media(max-width:1010px){.fab{right:24px}}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(40,36,50,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
  .modal{width:400px;max-width:100%;max-height:92vh;overflow:auto;background:var(--ivory);position:relative}
  .modal .mbar{background:var(--purple);color:var(--cream);font-weight:800;font-size:14px;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
  .modal .mbar .x{cursor:pointer;font-size:16px;background:none;border:none;color:var(--cream)}
  .modal .mbody{padding:18px 20px 20px}
  .fld{margin-bottom:16px}
  .fld>label{font-family:'Space Grotesk';font-size:10px;color:var(--ink-soft);letter-spacing:.08em;font-weight:600;display:block;margin-bottom:5px}
  .fld input[type=text],.fld input[type=date],.fld select{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--line);padding:5px 1px;font-size:15px;color:var(--ink);outline:none;border-radius:0}
  .fld input[type=text]:focus,.fld input[type=date]:focus,.fld select:focus{border-bottom-color:var(--purple)}
  .fld textarea{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--line);padding:5px 1px;font-size:15px;color:var(--ink);outline:none;min-height:52px;resize:vertical;line-height:1.6}
  .f2{display:flex;gap:16px}.f2>.fld{flex:1}
  .seg-in{display:flex;flex-wrap:wrap;gap:7px}
  .chipbtn{background:transparent;border:1.5px solid var(--line);border-radius:16px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--ink-soft)}
  .chipbtn.on{background:var(--purple);border-color:var(--purple);color:var(--cream)}
  .swatches{display:flex;gap:9px;flex-wrap:wrap}
  .sw{width:22px;height:22px;border:none;border-radius:50%;cursor:pointer;position:relative}
  .sw.on{outline:2px solid var(--ink);outline-offset:2px}
  .sw.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
  .mbtns{display:flex;gap:10px;margin-top:6px}
  .btn{border:none;background:var(--purple);color:var(--cream);padding:11px 18px;font-weight:800;font-size:14px;flex:1}
  .btn.ghost{background:var(--parchment-lo);color:var(--ink);flex:0 0 auto}
  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn.warn{background:transparent;color:var(--red)}
  .btn:disabled{opacity:.5}

  /* detail ticket header */
  .ticket{position:relative;overflow:hidden;background:var(--sky-cream)}
  .ticket .tkscene{height:clamp(150px,30vw,220px);overflow:hidden;line-height:0}
  .ticket .tkscene svg{width:100%;height:100%;display:block}
  .ticket .tkinfo{position:relative;padding:16px 20px 18px;background:var(--paper);border-top:2px dashed var(--line)}
  .ticket .tkinfo::before,.ticket .tkinfo::after{content:'';position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--appbg)}
  .ticket .tkinfo::before{left:-11px}
  .ticket .tkinfo::after{right:-11px}
  .ticket .tkbig{position:absolute;right:18px;top:14px;text-align:right;line-height:1}
  .ticket .tkbig .n{font-family:var(--f-hand);font-size:clamp(28px,7vw,40px);font-weight:700;color:var(--rust)}
  .ticket .tkbig .l{font-size:12px;color:var(--ink-soft);font-weight:700}
  .ticket .tkcity{font-size:clamp(21px,5vw,27px);font-weight:900;line-height:1.1;padding-right:74px}
  .ticket .tksub{font-family:var(--f-num);font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:4px}
  .ticket .tkpills{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .ticket .pill{background:var(--cream);padding:5px 12px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--ink)}

  /* detail */
  .metarow{display:flex;flex-wrap:wrap;align-items:center}
  .mi{display:flex;align-items:center;gap:7px;padding:2px 15px;font-size:13px;font-weight:600;color:var(--ink);border-right:1px solid var(--line);line-height:1.9}
  .mi:first-child{padding-left:0}.mi:last-child{border-right:none}
  .mi .cat{font-weight:800}
  .mi .dotc{width:12px;height:12px;border-radius:50%}
  .mi a{color:var(--purple);font-weight:700;text-decoration:none}
  .ta-view{font-size:14.5px;color:var(--ink);line-height:1.95;white-space:pre-wrap}
  .ta-edit{width:100%;background:var(--cream);border:none;padding:10px;font-size:14px;line-height:1.7;min-height:70px;resize:vertical;outline:none;color:var(--ink)}
  .day{margin-bottom:16px}
  .day .dh{padding:0 0 7px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:11px}
  .day .dc{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .chip{padding:4px 2px;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center;color:var(--ink)}
  .chip .dotc{width:9px;height:9px;border-radius:50%;flex:none}
  .chip .del{color:var(--ink-soft);font-size:12px;background:none;border:none;padding:0 0 0 2px}
  .chip a{color:inherit;text-decoration:none}
  .addchip{color:var(--gold-deep);padding:4px 10px;font-size:12px;font-weight:700;background:var(--parchment-lo);border:none;border-radius:14px}
  .gmapsbox{margin-top:8px;display:flex;gap:8px}
  .gmapsbox input{flex:1;background:var(--cream);border:none;padding:8px 10px;font-size:12px;outline:none;color:var(--ink)}

  /* recap page */
  .seg{display:flex;background:var(--cream);flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:7px 13px;font-size:12px;font-weight:700;color:var(--ink)}
  .seg button.on{background:var(--gold);color:var(--ink)}
  .rgrid{display:grid;grid-template-columns:290px 1fr;gap:16px}

async function geminiPostcard(dataURL,apiKey){

  const mime=m?m[1]:'image/jpeg', b64=m?m[2]:dataURL.replace(/^data:image\/\w+;base64,/,'');

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const clamp255=v=>v<0?0:v>255?255:v;
/* client-side instant-film photo for a Polaroid: center-crop square + gentle posterize (Polaroid frame is CSS) */
function makeSticker(srcDataURL){return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{
    const S=620;
    const c=document.createElement('canvas');c.width=S;c.height=S;const ctx=c.getContext('2d');
    const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    ctx.drawImage(img,sx,sy,m,m,0,0,S,S);
    try{
      const idata=ctx.getImageData(0,0,S,S);const d=idata.data;
      const levels=8,step=255/(levels-1),sat=1.16,con=1.06;
      for(let i=0;i<d.length;i+=4){
        let r=d[i],g=d[i+1],b=d[i+2];const gray=(r+g+b)/3;
        r=gray+(r-gray)*sat;g=gray+(g-gray)*sat;b=gray+(b-gray)*sat;
        r=(r-128)*con+128;g=(g-128)*con+128;b=(b-128)*con+128;
        d[i]=Math.round(Math.round(clamp255(r)/step)*step);
        d[i+1]=Math.round(Math.round(clamp255(g)/step)*step);

      }

  };
  img.onerror=rej;img.src=srcDataURL;
});}

Overall, use a 4:3 landscape composition, dividing the frame into left and right regions, but without drawing an obvious dividing line.

Determine the stamp's organization based on the original photo's composition:
- Iconic architecture: Retain the most distinctive outer contours, roofs, domes, arches, towers, or main structures.
- Mountain settlements: Compress buildings into a few terraced color blocks aligned along the terrain.
- Coastal scenery: Retain mountain contours, settlement layers, shorelines, and sparse intermittent water ripples.
- City panoramas: Retain the main skyline, one iconic building, and one or two layers of distant mountains.
- Natural landscapes: Retain primary mountain forms, trees, shorelines, or road orientations.
- Foreground occlusions: If narratively important in the original photo, retain as foreground stamp outlines.

Render each color as a separately hand-stamped effect: Authentic rubber stamp carving texture, hand-engraved marks, uneven line widths, contour notches, fractured edges, dry ink shortages, paper show-through, granular ink, uneven pressure, partial ghosting, and about 1-2 mm of subtle misregistration.

Allow natural misalignment between color layers; edges must not be digitally smoothed. The print should resemble a real carved stamp pressed onto aged paper, not a filtered photo, smooth vector illustration, or line-art logo.

Generate text based on the photo's location, theme, and visual imagery:
Location English name

async function geocode(location,country){
  const loc=(location||'').trim(),cty=(country||'').trim();
  if(!loc)return null;
  if(LOCATION_COORDS[loc])return{...LOCATION_COORDS[loc],country:CITY_COUNTRY[loc]||cty||null};
  try{
    const q=cty?`${loc} ${cty}`:loc;
    const res=await fetch(`https://nominatim.openstreetmap.org/search?${new URLSearchParams({q,format:'json',limit:'1','accept-language':'zh-TW,en',addressdetails:'1'})}`);
    if(res.ok){const data=await res.json();if(Array.isArray(data)&&data.length){const lat=parseFloat(data[0].lat),lng=parseFloat(data[0].lon);if(!isNaN(lat)&&!isNaN(lng))return{lat,lng,country:data[0].address&&data[0].address.country||cty||null};}}
  }catch(e){}
  if(cty&&COUNTRY_COORDS[cty])return{...COUNTRY_COORDS[cty]};
  return null;
}

/* ============ CALENDAR ============ */
function Calendar({start,trips,onCreate,onOpenTrip,onShift}){
  const [drag,setDrag]=useState(null); // {start, cur}
  const [hoverMemo,setHoverMemo]=useState(null); // {memo,name,color,x,y}
  const today=todayStr();
  // 6 months from the anchor (start)
  const months=[];
  for(let i=0;i<6;i++){const tot=start.y*12+start.m+i;months.push({y:Math.floor(tot/12),m:((tot%12)+12)%12});}
  const last=months[5];

  const tripByDate={};
  trips.forEach(t=>{daysBetween(t.startDate,t.endDate).forEach(d=>{if(!tripByDate[d])tripByDate[d]=t;});});

  const endDrag=()=>{
    if(drag&&drag.start&&drag.cur){
      const[a,b]=drag.start<=drag.cur?[drag.start,drag.cur]:[drag.cur,drag.start];
      onCreate(a,b);
    }
    setDrag(null);
  };
  useEffect(()=>{
    if(!drag)return;
    const up=()=>endDrag();
    window.addEventListener('mouseup',up);window.addEventListener('touchend',up);
    return()=>{window.removeEventListener('mouseup',up);window.removeEventListener('touchend',up);};
  });

  const inSel=(ds)=>{if(!drag)return false;const[a,b]=drag.start<=drag.cur?[drag.start,drag.cur]:[drag.cur,drag.start];return ds>=a&&ds<=b;};
  const DOW=['日','一','二','三','四','五','六'];

  return (
    <div>
    <div className="calnav">
      <button onClick={()=>onShift(-6)} aria-label="上半年">‹</button>
      <span className="rg">{start.y}/{pad(start.m+1)} – {last.y}/{pad(last.m+1)}</span>
      <button onClick={()=>onShift(6)} aria-label="下半年">›</button>
    </div>
    <div className="months">
      {months.map(({y,m},mi)=>{
        const first=new Date(y,m,1).getDay();
        const dim=new Date(y,m+1,0).getDate();
        const cells=[];
        for(let b=0;b<first;b++)cells.push(<div key={'b'+b} className="d blank"/>);
        for(let d=1;d<=dim;d++){
          const ds=fmtDate(y,m,d);
          const tr=tripByDate[ds];
          const isToday=ds===today;
          const sel=inSel(ds);
          let cls='d';
          if(tr)cls+=' trip';
          if(isToday)cls+=tr?' today':' today plain';
          if(sel)cls+=' sel';
          const ring=tr?{background:tr.color}:{};
          const handleDown=(e)=>{
            if(tr){onOpenTrip(tr.id);return;}
            setDrag({start:ds,cur:ds});
          };
          const handleEnter=(e)=>{
            if(drag)setDrag(dr=>({...dr,cur:ds}));
            if(tr){const r=e.currentTarget.getBoundingClientRect();setHoverMemo({memo:tr.memo||'',name:tr.location,purpose:migratePurpose(tr.purpose),dates:fmtRange(tr.startDate,tr.endDate),x:r.left+r.width/2,y:r.top});}
          };
          const handleLeave=()=>{if(tr)setHoverMemo(null);};
          cells.push(
            <div key={ds} className={cls}
              onMouseDown={handleDown} onMouseEnter={handleEnter} onMouseLeave={handleLeave}
              onTouchStart={handleDown}>
              <span className="ring" style={ring}>{d}</span>
            </div>
          );
        }
        return (
          <div key={y+'-'+m} className="m">
            <h4><span className="mon"><b>{pad(m+1)}</b>月</span><span className="mo">{y}</span></h4>
            <div className="dow">{DOW.map((x,i)=><div key={i}>{x}</div>)}</div>
            <div className="dg">{cells}</div>
          </div>
        );
      })}
    </div>
    {hoverMemo&&(
      <div className="memobubble" style={{left:hoverMemo.x,top:hoverMemo.y-8}}>
        <div className="mtitle"><span className="micon">{(PURPOSE[hoverMemo.purpose]||{}).icon||'📍'}</span>{hoverMemo.name}</div>
        <div className="mdates">{(PURPOSE[hoverMemo.purpose]||{}).label} · {hoverMemo.dates}</div>
        {hoverMemo.memo&&<div className="mtext">✎ {hoverMemo.memo}</div>}
      </div>
    )}
    </div>
  );
}

/* ============ TRIP MODAL (create + edit) ============ */
function TripModal({initial,onClose,onSave,onDelete}){
  const isEdit=!!initial.id;
  const [location,setLocation]=useState(initial.location||'');
  const [country,setCountry]=useState(initial.country||'');
  const autoRef=useRef(!initial.country); // eligible for auto-country until user edits it manually
  // instant auto-fill country from known-city dictionary as the city is typed
  useEffect(()=>{const c=CITY_COUNTRY[location.trim()];if(c&&(country===''||autoRef.current)){setCountry(c);autoRef.current=true;}},[location]);
  // for cities not in the dictionary, geocode on blur to fill country
  const onCityBlur=async()=>{const loc=location.trim();if(!loc||CITY_COUNTRY[loc])return;if(country===''||autoRef.current){const g=await geocode(loc,'');if(g&&g.country){setCountry(g.country);autoRef.current=true;}}};
  const [startDate,setStartDate]=useState(initial.startDate);
  const [endDate,setEndDate]=useState(initial.endDate);
  const [purpose,setPurpose]=useState(migratePurpose(initial.purpose)||'overseasLeisure');
  const [transport,setTransport]=useState(initial.transport&&TRANSPORT[initial.transport]?initial.transport:(initial.transport?'custom':'cruise'));
  const [customTransport,setCustomTransport]=useState(initial.transport&&!TRANSPORT[initial.transport]?initial.transport:'');
  const initComp=initial.companion||'';
  const [companion,setCompanion]=useState(initComp.startsWith('other:')?'other':initComp||'');
  const [companionOther,setCompanionOther]=useState(initComp.startsWith('other:')?initComp.slice(6):'');
  const [mood,setMood]=useState(initial.mood||'');
  const _ip=migratePurpose(initial.purpose)||'overseasLeisure';
  const [color,setColor]=useState(initial.colorCustom?(initial.color||PURPOSE[_ip].color):PURPOSE[_ip].color);
  const [memo,setMemo]=useState(initial.memo||'');
  const colorAuto=useRef(!initial.colorCustom); // 顏色跟類別走，除非使用者手動選色
  const pickPurpose=(k)=>{setPurpose(k);if(colorAuto.current)setColor(PURPOSE[k].color);};
  const [saving,setSaving]=useState(false);

  const save=async()=>{
    if(!location.trim())return;
    setSaving(true);
    const finalTransport=transport==='custom'?(customTransport.trim()||'其他'):transport;
    const finalCompanion=companion==='other'?('other:'+companionOther.trim()):companion;
    const geo=await geocode(location,country);
    const trip={
      id:initial.id||newId(),
      location:location.trim(),
      country:(geo&&geo.country)||country.trim()||CITY_COUNTRY[location.trim()]||'',
      startDate,endDate,color,purpose,
      transport:finalTransport,companion:finalCompanion,mood:mood||null,
      colorCustom:!colorAuto.current,
      memo:memo.trim(),
      summary:initial.summary||'',dailyPlaces:initial.dailyPlaces||{},
      lat:geo?geo.lat:(initial.lat),lng:geo?geo.lng:(initial.lng),
    };
    onSave(trip);
  };

  return (
    <div className="scrim" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">

/* ============ DETAIL ============ */
function Detail({trip,onBack,onEdit,onUpdate}){
  const [summary,setSummary]=useState(trip.summary||'');
  const [editingSum,setEditingSum]=useState(false);
  const days=daysBetween(trip.startDate,trip.endDate);
  const dp=trip.dailyPlaces||{};
  const [adding,setAdding]=useState(null); // {date,type}
  const [nameInput,setNameInput]=useState('');
  const [gmapsFor,setGmapsFor]=useState(null);
  const [gmapsVal,setGmapsVal]=useState('');
  const placeCount=Object.values(trip.dailyPlaces||{}).reduce((a,l)=>a+l.length,0);
  const [itinOpen,setItinOpen]=useState(placeCount>0);

  const commitSummary=()=>{setEditingSum(false);if(summary!==trip.summary)onUpdate({...trip,summary});};
  const addPlace=(date,type,name,gmapsUrl)=>{
    const places={...dp};const list=(places[date]||[]).slice();
    list.push({id:newPlaceId(),type,name:name.trim(),gmapsUrl:gmapsUrl||null});
    places[date]=list;onUpdate({...trip,dailyPlaces:places});
  };
  const removePlace=(date,id)=>{
    const places={...dp};places[date]=(places[date]||[]).filter(p=>p.id!==id);onUpdate({...trip,dailyPlaces:places});
  };
  const submitAdd=()=>{
    if(adding&&nameInput.trim()){addPlace(adding.date,adding.type,nameInput);}
    setAdding(null);setNameInput('');
  };
  const submitGmaps=(date)=>{
    if(isGmapsUrl(gmapsVal)){const nm=parseGmapsUrl(gmapsVal);if(nm)addPlace(date,'sight',nm,gmapsVal);}
    setGmapsFor(null);setGmapsVal('');
  };
  const p=PURPOSE[migratePurpose(trip.purpose)];
  const tp=TRANSPORT[trip.transport];
  const compLabel=(()=>{const c=trip.companion||'';if(c.startsWith('other:'))return c.slice(6);const f=COMPANIONS.find(x=>x[0]===c);return f?f[1]:'';})();
  const sceneTp=TRANSPORT[trip.transport]?trip.transport:'cruise';
  const _du=daysUntil(trip.startDate);
  const cd=_du>0?{n:_du,l:'天後'}:(trip.endDate>=todayStr()?{n:'進行中',l:''}:{n:tripLength(trip),l:'天'});

  return (
    <div>
      <div className="topbar">
        <button className="backbtn" onClick={onBack}>‹ 返回</button>
        <div style={{marginLeft:'auto',display:'flex',gap:9,alignItems:'center'}}>
          <a className="backbtn" href={mapsUrl(trip.location,trip.country)} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>📍 Maps</a>
          <button className="btn gold" style={{padding:'8px 16px',flex:'none'}} onClick={onEdit}>編輯</button>
        </div>
      </div>

      <div className="ticket">
        <div className="tkscene" dangerouslySetInnerHTML={{__html:sceneSVG(sceneTp,trip.country,'xMidYMax slice')}}/>
        <div className="tkinfo">
          <div className="tkbig"><span className="n">{cd.n}</span>{cd.l&&<span className="l"> {cd.l}</span>}</div>
          <div className="tkcity">{trip.location}{trip.country?` · ${trip.country}`:''}</div>
          <div className="tksub">{fmtRange(trip.startDate,trip.endDate)} · {tripLength(trip)} 天</div>
          <div className="tkpills">
            {p&&<span className="pill" style={{background:p.color,color:'var(--cream)'}}>{p.label}</span>}
            <span className="pill">{tp?`${tp.emoji} ${tp.label}`:`🧭 ${trip.transport||'—'}`}</span>
            {compLabel&&<span className="pill">👥 {compLabel}</span>}
            {trip.mood&&<span className="pill">{trip.mood}</span>}
          </div>
        </div>
      </div>

      <div className="sh"><span className="zh">摘要</span><span className="e">SUMMARY</span><span className="r"/></div>
      <div className="pad">
        {editingSum?(
          <textarea className="ta-edit" value={summary} autoFocus onChange={e=>setSummary(e.target.value)} onBlur={commitSummary} placeholder="寫下這趟旅程的心得 / 備註…"/>
        ):(
          <div className="ta-view" onClick={()=>setEditingSum(true)} style={{cursor:'text',minHeight:24,color:summary?'var(--ink)':'var(--ink-soft)'}}>{summary||'點此新增摘要…'}</div>
        )}
      </div>

      <div className="sh" style={{cursor:'pointer',userSelect:'none'}} onClick={()=>setItinOpen(o=>!o)}>
        <span className="zh">每日行程</span><span className="e">DAILY · 選填</span><span className="r"/>
        <span style={{fontSize:12,fontWeight:700,color:'var(--purple)'}}>{itinOpen?'收合 ▾':(placeCount>0?`${placeCount} 個地點 ▸`:'展開安排 ▸')}</span>
      </div>
      {itinOpen&&<div className="pad" style={{paddingBottom:16}}>
        {days.map((ds,i)=>{
          const list=dp[ds]||[];
          const sorted=[...list].sort((a,b)=>PLACE_ORDER.indexOf(a.type)-PLACE_ORDER.indexOf(b.type));
          return (
            <div className="day" key={ds}>
              <div className="dh"><span>{fmtLabel(ds)} · 第 {i+1} 天</span></div>
              <div className="dc">
                {sorted.map(pl=>{
                  const pt=PLACE_TYPES[pl.type]||PLACE_TYPES.other;
                  return (
                    <span className="chip" key={pl.id}>
                      <span className="dotc" style={{background:pt.color}}/>
                      {pl.gmapsUrl?<a href={pl.gmapsUrl} target="_blank" rel="noreferrer">{pl.name}</a>:pl.name}
                      <button className="del" onClick={()=>removePlace(ds,pl.id)}>✕</button>
                    </span>
                  );
                })}
                {adding&&adding.date===ds?(
                  <span className="chip" style={{background:'var(--parchment-lo)',padding:'2px 6px'}}>
                    <span className="dotc" style={{background:(PLACE_TYPES[adding.type]||PLACE_TYPES.other).color}}/>
                    <input autoFocus value={nameInput} onChange={e=>setNameInput(e.target.value)}
                      onKeyDown={e=>{if(e.key==='Enter')submitAdd();if(e.key==='Escape'){setAdding(null);setNameInput('');}}}
                      onBlur={submitAdd} placeholder={(PLACE_TYPES[adding.type]||{}).label+'名稱'}
                      style={{border:'none',background:'transparent',outline:'none',fontSize:13,width:110,color:'var(--ink)'}}/>
                  </span>
                ):(
                  PLACE_ORDER.map(tk=><button key={tk} className="addchip" onClick={()=>{setAdding({date:ds,type:tk});setNameInput('');}}>＋ {PLACE_TYPES[tk].label}</button>)
                )}
              </div>
              {gmapsFor===ds?(
                <div className="gmapsbox">
                  <input autoFocus value={gmapsVal} onChange={e=>setGmapsVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submitGmaps(ds);}} placeholder="貼上 Google Maps 連結…"/>
                  <button className="addchip" onClick={()=>submitGmaps(ds)}>匯入</button>
                  <button className="addchip" onClick={()=>{setGmapsFor(null);setGmapsVal('');}}>取消</button>
                </div>
              ):(
                <div className="gmapsbox"><button className="addchip" onClick={()=>{setGmapsFor(ds);setGmapsVal('');}} style={{background:'transparent',color:'var(--ink-soft)'}}>📋 貼 Google Maps 連結匯入地點</button></div>
              )}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

function WorldMap({trips,onOpenTrip}){
  const withC=trips.filter(t=>typeof t.lat==='number'&&typeof t.lng==='number');
  const without=trips.filter(t=>typeof t.lat!=='number'||typeof t.lng!=='number');
  const groups={};
  withC.forEach(t=>{const k=`${t.lat.toFixed(2)},${t.lng.toFixed(2)}`;if(!groups[k])groups[k]={lat:t.lat,lng:t.lng,name:t.location,trips:[]};groups[k].trips.push(t);});
  const pts=Object.values(groups).map(p=>{const s=[...p.trips].sort((a,b)=>b.startDate.localeCompare(a.startDate));return{...p,color:s[0].color,size:Math.min(9,5+Math.floor(p.trips.length*0.8))};});
  const [hover,setHover]=useState(null);
  const [world,setWorld]=useState(false);
  const vb=world?'0 0 1000 500':'560 60 460 320';
  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:6}}>

      </div>
      <div className="worldwrap">
      <svg viewBox={vb} style={{width:'100%',height:'auto',display:'block',maxHeight:420}}>
        <Continents/>
        {pts.map((p,i)=>{const{x,y}=project(p.lat,p.lng);const h=hover===i;return (
          <g key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} onClick={()=>p.trips.length===1&&onOpenTrip(p.trips[0].id)} style={{cursor:p.trips.length===1?'pointer':'default'}}>
            <circle cx={x} cy={y} r={p.size+5} fill={p.color} opacity={h?0.4:0.22}/>

            {p.trips.length>1&&<text x={x} y={y+1} textAnchor="middle" dominantBaseline="middle" fill="#fff" style={{fontFamily:"var(--f-num)",fontSize:p.size+2,fontWeight:700,pointerEvents:'none'}}>{p.trips.length}</text>}
          </g>
        );})}
        {hover!==null&&pts[hover]&&(()=>{const p=pts[hover];const{x,y}=project(p.lat,p.lng);const days=p.trips.reduce((s,t)=>s+tripLength(t),0);const txt=`${p.name} · ${p.trips.length} 段 · ${days} 天`;const w=Math.max(120,txt.length*13);const lx=Math.min(Math.max(x-w/2,10),1000-w-10);const ly=y-p.size-30;return (<g pointerEvents="none"><rect x={lx} y={ly} width={w} height={24} rx={3} fill="var(--ink)"/><text x={lx+w/2} y={ly+16} textAnchor="middle" fill="#fff" style={{fontSize:13,fontWeight:600}}>{txt}</text></g>);})()}

        </div>
      )}
    </div>
  );
}

/* ============ RECAP ============ */
function Recap({year,trips,onBack,onOpenTrip}){
  const [range,setRange]=useState('full');
  const bounds=(()=>{
    if(range==='h1')return[`${year}-01-01`,`${year}-06-30`];
    if(range==='h2')return[`${year}-07-01`,`${year}-12-31`];
    return[`${year}-01-01`,`${year}-12-31`];
  })();
  const yTrips=trips.filter(t=>overlapDays(t,bounds[0],bounds[1])>0);
  const totalDays=yTrips.reduce((s,t)=>s+overlapDays(t,bounds[0],bounds[1]),0);
  const totalPlaces=yTrips.reduce((s,t)=>s+Object.values(t.dailyPlaces||{}).reduce((a,l)=>a+l.length,0),0);
  const [expanded,setExpanded]=useState(null);
  // country -> cities
  const countries={};
  yTrips.forEach(t=>{const c=t.country||'其他';if(!countries[c])countries[c]={visits:0,cities:{}};countries[c].visits++;const city=t.location;countries[c].cities[city]=(countries[c].cities[city]||0)+1;});
  const countryList=Object.entries(countries).sort((a,b)=>b[1].visits-a[1].visits);

  const genAnim=()=>{alert(`🎬「${OWNER} 的 ${year} Trips」動畫產出功能開發中，敬請期待！`);};

  return (
    <div>
      <div className="topbar">
        <button className="backbtn" onClick={onBack}>‹ 返回</button>
        <div style={{marginLeft:6}}><div className="zh" style={{fontSize:19}}>{year} 年度回顧</div><div className="sub">YEAR IN REVIEW</div></div>
        <div className="seg" style={{marginLeft:'auto'}}>
          {[['full','全年'],['h1','上半年'],['h2','下半年']].map(([k,l])=><button key={k} className={range===k?'on':''} onClick={()=>setRange(k)}>{l}</button>)}
        </div>
      </div>
      <div className="pad" style={{paddingTop:18}}>
        <div className="rgrid">
          <div>
            <div className="stat3">
              <div className="rstat"><div className="n">{yTrips.length}</div><div className="l">旅程段數</div></div>
              <div className="rstat"><div className="n">{totalPlaces}</div><div className="l">造訪地點</div></div>
              <div className="rstat"><div className="n">{totalDays}</div><div className="l">在外天數</div></div>
            </div>
            <div className="panel">
              <div style={{fontWeight:900,fontSize:13,marginBottom:9}}>國家清單 · 點擊展開城市</div>
              <div className="clist">
                {countryList.length===0&&<div style={{fontSize:13,color:'var(--ink-soft)'}}>這段期間還沒有旅程</div>}
                {countryList.map(([c,info])=>(
                  <div className="c" key={c} onClick={()=>setExpanded(expanded===c?null:c)}>
                    <div className="top"><span className="nm">{c}</span><span className="ct">{Array.from({length:Math.min(info.visits,5)}).map((_,i)=><span key={i} className="cdot" style={{background:'var(--rust)'}}/>)} {info.visits}</span></div>
                    {expanded===c&&<div className="cities">{Object.entries(info.cities).map(([city,n])=><span className="citytag" key={city}>{city}{n>1?` ×${n}`:''}</span>)}</div>}
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="panel" style={{padding:12}}>
            <WorldMap trips={yTrips} onOpenTrip={onOpenTrip}/>
          </div>
        </div>
      </div>
      <div className="genbar">
        <div><div className="t">🎬 一鍵產出動畫</div><div className="s">產出「{OWNER} 的 {year} Trips」該年度所有行程演示</div></div>
        <button className="go" onClick={genAnim}>產出動畫 ▶</button>
      </div>
      <div className="foot"><div className="en">© {OWNER} LIN · {year}</div></div>
    </div>
  );
}

function AddStickerModal({trips,onClose,onSave,geminiKey,onNeedKey}){
  const [rawImg,setRawImg]=useState(null); // 上傳的原始照片
  const [card,setCard]=useState(null);     // 產出的明信片
  const [tripId,setTripId]=useState('');
  const [title,setTitle]=useState('');
  const [busy,setBusy]=useState(false);
  const [gen,setGen]=useState(false);
  const [err,setErr]=useState('');
  const [copied,setCopied]=useState(false);
  const fileRef=useRef(null);
  const pick=async(e)=>{const f=e.target.files&&e.target.files[0];if(!f)return;setBusy(true);setErr('');setCard(null);try{const d=await compressImage(f,1200,0.86);setRawImg(d);}catch(err){}setBusy(false);};
  const generate=async()=>{if(!rawImg)return;if(!geminiKey){onNeedKey();return;}setGen(true);setErr('');try{const out=await geminiPostcard(rawImg,geminiKey);const small=await shrinkDataURL(out,1280,0.86);setCard(small);}catch(e){setErr(String(e.message||e));}setGen(false);};
  const copyPrompt=()=>{try{navigator.clipboard.writeText(POSTCARD_PROMPT);setCopied(true);setTimeout(()=>setCopied(false),1800);}catch(e){}};
  const sortedTrips=[...trips].sort((a,b)=>b.startDate.localeCompare(a.startDate));
  const finalImg=card||rawImg;
  const save=()=>{if(!finalImg)return;onSave({id:'stk-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),img:finalImg,tripId:tripId||null,title:title.trim(),ts:Date.now()});};
  return (
    <div className="scrim" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{width:420}}>
        <div className="mbar"><span>加入明信片</span><button className="x" onClick={onClose}>✕</button></div>
        <div className="mbody">
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={pick}/>
          {!rawImg&&(
            <div className="uploadbox" style={{marginBottom:12}} onClick={()=>fileRef.current.click()}>{busy?'處理中…':'📷 上傳旅遊照片'}</div>
          )}
          {rawImg&&(
            <div style={{marginBottom:12,textAlign:'center'}}>
              <img className="uploadprev" src={card||rawImg} onClick={()=>fileRef.current.click()} style={{cursor:'pointer'}}/>
              <div style={{fontSize:11,color:'var(--ink-soft)',marginTop:6}}>{card?'✓ 明信片已產生 · 點圖可重選照片':'原始照片 · 點圖可重選'}</div>
            </div>
          )}
          {rawImg&&(
            <div style={{marginBottom:12}}>
              <button className="btn" style={{width:'100%'}} onClick={generate} disabled={gen}>{gen?'🪄 產生中…（約10-30秒）':(card?'🔄 重新產生明信片':'🪄 產生明信片（Gemini）')}</button>
              {err&&<div style={{fontSize:11,color:'var(--red)',marginTop:7,lineHeight:1.6}}>⚠ {err}</div>}
              <div style={{fontSize:11,color:'var(--ink-soft)',marginTop:8,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <span>沒金鑰？可自行在 Claude 產出，複製此 prompt →</span>
                <button className="chipbtn" style={{padding:'3px 9px',fontSize:11}} onClick={copyPrompt}>{copied?'✓ 已複製':'📋 複製 Prompt'}</button>
              </div>
            </div>
          )}
          <div className="fld"><label>標示旅程 TRIP</label>
            <select value={tripId} onChange={e=>setTripId(e.target.value)}>
              <option value="">（不標示）</option>
              {sortedTrips.map(t=><option key={t.id} value={t.id}>{t.location}{t.country?` · ${t.country}`:''}　{fmtRange(t.startDate,t.endDate)}</option>)}
            </select>
          </div>
          <div className="fld"><label>備註 NOTE（選填）</label><input type="text" value={title} onChange={e=>setTitle(e.target.value)} placeholder="例：晴空塔的夕陽"/></div>
          <div className="mbtns"><button className="btn" onClick={save} disabled={!finalImg}>加入收集冊{card?'':'（原圖）'}</button><button className="btn ghost" onClick={onClose}>取消</button></div>
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App(){
  const [loading,setLoading]=useState(true);
  const [trips,setTrips]=useState([]);
  const [year,setYear]=useState(2026);
  const [calStart,setCalStart]=useState(()=>{const n=new Date();let y=n.getFullYear(),m=n.getMonth()-1;if(m<0){m+=12;y--;}return {y,m};});
  const [view,setView]=useState('home');
  const [selId,setSelId]=useState(null);
  const [modal,setModal]=useState(null); // {mode:'create'|'edit', ...}
  const [skin,setSkin]=useState('island');
  const [settingsOpen,setSettingsOpen]=useState(false);
  const changeSkin=(s)=>{setSkin(s);storage.set('skin',s).catch(()=>{});};
  const [stickers,setStickers]=useState([]);
  const [addStk,setAddStk]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  const [geminiKey,setGeminiKey]=useState(()=>{try{return localStorage.getItem('gemini_key')||'';}catch(e){return '';}});
  const saveGeminiKey=(k)=>{setGeminiKey(k);try{k?localStorage.setItem('gemini_key',k):localStorage.removeItem('gemini_key');}catch(e){}};
  const addSticker=(s)=>{const next=[...stickers,s];setStickers(next);saveStickers(next);setAddStk(false);};
  const deleteSticker=(id)=>{const next=stickers.filter(s=>s.id!==id);setStickers(next);saveStickers(next);};
  const shiftCal=(delta)=>{const tot=calStart.y*12+calStart.m+delta;const y=Math.floor(tot/12),m=((tot%12)+12)%12;setCalStart({y,m});setYear(y);};
  const goYear=(ny)=>{setYear(ny);setCalStart({y:ny,m:0});};

  useEffect(()=>{(async()=>{
    const sk=await storage.get('skin').catch(()=>null);if(sk&&sk.value)setSkin(sk.value);
    loadStickers().then(setStickers).catch(()=>{});
    const t=await loadTrips();
    // backfill country / coords from the built-in dictionary (instant)
    let changed=false;
    for(const tr of t){
      if(!tr.country&&CITY_COUNTRY[tr.location]){tr.country=CITY_COUNTRY[tr.location];changed=true;}
      if(typeof tr.lat!=='number'&&LOCATION_COORDS[tr.location]){const c=LOCATION_COORDS[tr.location];tr.lat=c.lat;tr.lng=c.lng;changed=true;}
      // 未手動改色的旅程 → 顏色一律照類別
      if(!tr.colorCustom){const pc=PURPOSE[migratePurpose(tr.purpose)||'overseasLeisure'].color;if(tr.color!==pc){tr.color=pc;changed=true;}}
    }
    setTrips(t);setLoading(false);
    if(changed)saveTrips(t);
    // geocode any trips still missing a country (throttled for Nominatim), then merge
    let geo=false;
    for(const tr of t){
      if(!tr.country&&tr.location){
        try{const g=await geocode(tr.location,'');if(g){if(g.country){tr.country=g.country;geo=true;}if(typeof tr.lat!=='number'&&typeof g.lat==='number'){tr.lat=g.lat;tr.lng=g.lng;geo=true;}}}catch(e){}
        await new Promise(r=>setTimeout(r,1100));
      }
    }
    if(geo)setTrips(prev=>{const byId={};t.forEach(x=>byId[x.id]=x);const merged=prev.map(p=>{const m=byId[p.id];return (m&&!p.country&&m.country)?{...p,country:m.country,lat:(typeof p.lat==='number'?p.lat:m.lat),lng:(typeof p.lng==='number'?p.lng:m.lng)}:p;});saveTrips(merged);return merged;});
  })();},[]);
  const persist=(next)=>{setTrips(next);saveTrips(next);};

  const upcoming=useMemo(()=>{
    const td=todayStr();
    return [...trips].filter(t=>t.endDate>=td).sort((a,b)=>a.startDate.localeCompare(b.startDate));
  },[trips]);
  const nextTrip=upcoming[0]||null;

  const openCreate=(a,b)=>setModal({mode:'edit-obj',initial:{startDate:a,endDate:b}});
  const openTrip=(id)=>{setSelId(id);setView('detail');};
  const selTrip=trips.find(t=>t.id===selId);

  const saveTrip=(trip)=>{
    const exists=trips.some(t=>t.id===trip.id);
    const next=exists?trips.map(t=>t.id===trip.id?trip:t):[...trips,trip];
    persist(next);setModal(null);
  };
  const deleteTrip=(id)=>{persist(trips.filter(t=>t.id!==id));setModal(null);if(selId===id){setSelId(null);setView('home');}};
  const updateTrip=(trip)=>persist(trips.map(t=>t.id===trip.id?trip:t));

  if(loading)return <div className="loading">LOADING…</div>;

  return (
    <div className="app" data-skin={skin}>
      {view==='home'&&(<>
        <div className="topbar">
          <svg className="logom" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" fill="var(--purple)"/><circle cx="20" cy="17" r="8" fill="var(--gold)"/><path d="M20 25 l7 8 l-14 0 z" fill="var(--teal)"/></svg>
          <div><div className="zh">{year} · {ZODIAC_TC[year]||''}年</div><div className="sub">TRAVEL JOURNAL</div></div>
          <div className="yswitch">
            <button className="arw" onClick={()=>goYear(year-1)}>‹</button>
            <span className="cur en">{year}</span>
            <button className="arw" onClick={()=>goYear(year+1)}>›</button>
          </div>
          <button className="gear" onClick={()=>setSettingsOpen(true)} aria-label="設定">⚙</button>
        </div>

        <Hero nextTrip={nextTrip} skin={skin} year={year}/>

        <div className="sh"><span className="zh">年曆</span><span className="e">TAP OR DRAG TO CREATE</span><span className="r"/></div>
        <div className="pad">
          <Calendar start={calStart} trips={trips} onCreate={openCreate} onOpenTrip={openTrip} onShift={shiftCal}/>
          <div className="caltip">
            <Spark c="var(--gold-deep)" s={10}/> 點擊或滑動日期 → 填寫旅程詳情（圓點＝已排旅程）
          </div>
        </div>

        <div className="sh"><span className="zh">年度回顧</span><span className="e">RECAP</span><span className="r"/></div>
        <div className="pad" style={{paddingBottom:24}}>
          <div className="panel">
            <div className="recapteaser">
              {(()=>{const yt=trips.filter(t=>overlapDays(t,`${year}-01-01`,`${year}-12-31`)>0);const days=yt.reduce((s,t)=>s+overlapDays(t,`${year}-01-01`,`${year}-12-31`),0);const places=yt.reduce((s,t)=>s+Object.values(t.dailyPlaces||{}).reduce((a,l)=>a+l.length,0),0);const cs=new Set(yt.map(t=>t.country||'其他'));return (<>
                <div className="stat"><div className="n">{yt.length}</div><div className="l">旅程段數</div></div>
                <div className="stat"><div className="n">{places}</div><div className="l">造訪地點</div></div>
                <div className="stat"><div className="n">{days}</div><div className="l">在外天數</div></div>
                <div className="stat"><div className="n">{cs.size}</div><div className="l">國家</div></div>
              </>);})()}
              <button className="genbtn" onClick={()=>setView('recap')}>🎬 {OWNER} 的 {year} Trips</button>
            </div>
          </div>
        </div>

        <div className="sh"><span className="zh">明信片收集冊</span><span className="e">POSTCARD ALBUM</span><span className="r"/></div>
        <div className="pad" style={{paddingBottom:24}}>
          <div className="panel stkteaser" onClick={()=>setView('album')}>
            {stickers.length>0?(
              <div className="stkstrip">{stickers.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,7).map(s=><div className="mini" key={s.id}><img src={s.img} alt=""/></div>)}</div>
            ):(
              <div className="stkteaser-empty">還沒有明信片 · 用明信片 prompt 產出後上傳，收藏你的每一趟 ✦</div>
            )}
            <div className="stkteaser-foot">
              <span className="cnt">{stickers.length} 張明信片</span>
              <button className="genbtn" style={{background:'var(--gold)',color:'var(--ink)'}} onClick={(e)=>{e.stopPropagation();setAddStk(true);}}>＋ 加入明信片</button>
              <span className="enter">進入收集冊 ›</span>
            </div>
          </div>
        </div>

        <div className="foot"><div className="en">© {OWNER} LIN · {year}</div></div>

        <button className="fab" onClick={()=>{const t=todayStr();setModal({mode:'edit-obj',initial:{startDate:t,endDate:t}});}}>＋ 新增旅程</button>
      </>)}

      {view==='detail'&&selTrip&&(
        <Detail trip={selTrip} onBack={()=>{setView('home');setSelId(null);}} onEdit={()=>setModal({mode:'edit-obj',initial:selTrip})} onUpdate={updateTrip}/>
      )}

      {view==='recap'&&(
        <Recap year={year} trips={trips} onBack={()=>setView('home')} onOpenTrip={openTrip}/>
      )}

      {view==='album'&&(
        <StickerAlbum stickers={stickers} trips={trips} onBack={()=>setView('home')} onAdd={()=>setAddStk(true)} onDelete={deleteSticker} onView={setLightbox}/>
      )}

      {addStk&&<AddStickerModal trips={trips} onClose={()=>setAddStk(false)} onSave={addSticker} geminiKey={geminiKey} onNeedKey={()=>{setAddStk(false);setSettingsOpen(true);}}/>}
      {lightbox&&<div className="lightbox" onClick={()=>setLightbox(null)}><img src={lightbox} alt=""/></div>}

      {modal&&(
        <TripModal initial={modal.initial} onClose={()=>setModal(null)} onSave={saveTrip} onDelete={deleteTrip}/>
      )}

      {settingsOpen&&(
        <div className="scrim" onMouseDown={e=>{if(e.target===e.currentTarget)setSettingsOpen(false);}}>
          <div className="modal" style={{width:360}}>
            <div className="mbar"><span>設定</span><button className="x" onClick={()=>setSettingsOpen(false)}>✕</button></div>
            <div className="mbody">
              <div style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10,fontWeight:600}}>外觀皮膚（可隨時替換）</div>
              {[['island','島嶼旅人','平面向量・現代明亮'],['journal','手繪日誌','舊版・手寫紙感']].map(([k,name,desc])=>(
                <div key={k} className="skinopt" data-on={skin===k} onClick={()=>changeSkin(k)}>
                  <div><div style={{fontWeight:800,fontSize:15}}>{name}</div><div style={{fontSize:12,color:'var(--ink-soft)',marginTop:2}}>{desc}</div></div>
                  {skin===k&&<span style={{color:'var(--purple)',fontWeight:800,fontSize:13}}>✓ 使用中</span>}
                </div>
              ))}
              <div style={{fontSize:12,color:'var(--ink-soft)',margin:'16px 0 8px',fontWeight:600,borderTop:'1px solid var(--line)',paddingTop:14}}>Gemini API 金鑰（用於網頁端直接產明信片）</div>
              <div className="fld"><input type="password" value={geminiKey} onChange={e=>saveGeminiKey(e.target.value.trim())} placeholder="貼上你的 Google Gemini API 金鑰"/></div>
              <div style={{fontSize:11,color:'var(--ink-soft)',lineHeight:1.7}}>
                {geminiKey?'✓ 已設定（只存在此瀏覽器）':'未設定 · 到 '}
                {!geminiKey&&<a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" style={{color:'var(--purple)',fontWeight:700}}>Google AI Studio</a>}
                {!geminiKey&&' 免費申請'}
                {geminiKey&&<button className="chipbtn" style={{marginLeft:8,padding:'3px 10px',fontSize:11}} onClick={()=>saveGeminiKey('')}>清除</button>}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
