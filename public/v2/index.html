<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行日誌 · Travel Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@500;700&family=Inter+Tight:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.7.0/style.css" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  /* ============ TOKENS : 方格手帳 (grid notebook on a cutting mat) ============ */
  :root{
    --desk:#34483F; --desk-line:rgba(255,255,255,.055);
    --paper:#F4F5F0; --pane:rgba(255,255,255,.62); --ticket:#FCFCF8;
    --dot:#C8CFC0; --line:#CBD2C6; --hl:rgba(224,178,76,.42);
    --ink:#1D2B3A; --ink-soft:#5B6872; --stamp:#B4503A;
    /* legacy names used by illustrations & inline styles, remapped */
    --parchment:#E7EADF; --parchment-lo:#DADFD0; --appbg:#F4F5F0; --cream:#FBFBF7; --ivory:#FBFBF7;
    --gold:#D6A84E; --gold-deep:#9C7426;
    --purple:#3F5A7A; --purple-deep:#2F4766;
    --teal:#4F8579; --teal-deep:#3A6A60;
    --lavender:#C9CFD6; --dusty:#A3ADB8; --dusty-deep:#7C8794;
    --sage:#8E9E77; --sage-deep:#66764E;
    --sky-cream:#E6EAE0; --sky-lav:#CFDCDD; --sky-top:#B7CCD0;
    --sea:#5A8494; --sea-lo:#78A0AE;
    --brown:#7C6349; --brown-lo:#96795C;
    --rust:#C67B65; --rust-lo:#D3927E; --red:#B4503A;
    --f-en:'Special Elite'; --f-hand:'Caveat'; --f-num:'Special Elite';
    --f-zh:'LXGW WenKai TC','Noto Sans TC','PingFang TC',sans-serif;
  }
  .app[data-skin="night"]{
    --paper:#1F2A2D; --pane:rgba(255,255,255,.045); --ticket:#273337;
    --dot:#34434A; --line:#3A4B50; --hl:rgba(224,178,76,.30);
    --ink:#E8EEE6; --ink-soft:#9DB0B0; --stamp:#E58F76;
    --parchment:#2B393D; --parchment-lo:#34454A; --appbg:#1F2A2D; --cream:#DDE4D8; --ivory:#273337;
    --gold:#E8D9A8; --gold-deep:#E0B24C;
    --purple:#8FB0D6; --purple-deep:#B3CCE8;
    --teal:#6FB0A2; --teal-deep:#8ACBBC;
    --sky-cream:#33444A; --sky-lav:#2B3B42; --sky-top:#223138;
    --sea:#4B7482; --sea-lo:#5F8B99;
    --lavender:#4A5A66; --dusty:#586976;
    --sage:#6C7F5A; --sage-deep:#566848;
    --red:#E58F76;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background-color:var(--desk);
    background-image:linear-gradient(var(--desk-line) 1px,transparent 1px),linear-gradient(90deg,var(--desk-line) 1px,transparent 1px);
    background-size:28px 28px;
    color:var(--ink);font-family:var(--f-zh);font-size:15px;-webkit-font-smoothing:antialiased;line-height:1.55
  }
  body:has(.app[data-skin="night"]){--desk:#10181A}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}
  a{color:inherit}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:var(--parchment-lo);border-radius:4px}
  :focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:3px}
  .en{font-family:var(--f-en),var(--f-zh)}

  /* the notebook page */
  .app{
    max-width:920px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px;
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.7px);
    background-size:22px 22px;background-position:11px 11px;
  }
  @media(min-width:1000px){
    .app{margin:28px auto;min-height:calc(100vh - 56px);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.2),0 24px 50px -10px rgba(0,0,0,.45);padding-left:30px}
    /* binding holes */
    .app::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:16px;pointer-events:none;
      background:radial-gradient(circle at 8px 8px,var(--desk) 5.5px,transparent 6.5px) 0 14px/16px 46px repeat-y;opacity:.9}
  }

  /* ============ TOP BAR ============ */
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .logom{width:38px;height:38px;flex:none}
  .topbar .zh{font-size:22px;font-weight:700;line-height:1.15}
  .topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .yswitch{margin-left:auto;display:flex;align-items:center;gap:6px}
  .yswitch .arw,.gear{width:36px;height:36px;border:1.5px solid var(--ink);background:transparent;border-radius:50%;font-size:17px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
  .yswitch .cur{font-family:var(--f-num);font-size:22px;min-width:62px;text-align:center}
  .gear{margin-left:4px}
  .topbar>div:not(.yswitch){min-width:0}
  .topbar .zh{white-space:nowrap}
  @media(max-width:520px){.topbar{gap:8px;padding:14px 16px 10px}.topbar .zh{font-size:19px}.topbar .sub{display:none}.logom{width:32px;height:32px}.yswitch .cur{min-width:50px;font-size:20px}.yswitch .arw,.gear{width:34px;height:34px}.yswitch{gap:2px}.pad{padding:0 16px}.sh{margin-left:16px;margin-right:16px}}
  .gear svg{width:18px;height:18px}
  @media(hover:hover){.yswitch .arw:hover,.gear:hover{background:var(--ink);color:var(--paper)}}
  .backbtn{background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:20px;padding:6px 15px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  @media(hover:hover){.backbtn:hover{background:var(--ink);color:var(--paper)}}

  /* section head : highlighter-marked title */
  .sh{display:flex;align-items:baseline;gap:10px;margin:34px 20px 14px}
  .sh .zh{font-weight:700;font-size:21px;line-height:1.3;padding:0 4px;margin-left:-4px;background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%)}
  .sh .e{font-size:13px;color:var(--ink-soft)}
  .sh .r{display:none}
  .pad{padding:0 20px}

  /* ============ HERO : the next-trip ticket stub ============ */
  .stubwrap{filter:drop-shadow(0 10px 10px rgba(29,43,58,.16)) drop-shadow(0 1px 0 rgba(29,43,58,.12));margin:6px 0 0}
  .stub{--sideW:340px;--sideH:150px;position:relative;display:flex;min-height:200px;background:var(--ticket);border-top:6px solid var(--tc,var(--rust));border-radius:4px;
    -webkit-mask:radial-gradient(circle 12px at calc(100% - var(--sideW)) 0,#0000 97%,#000),radial-gradient(circle 12px at calc(100% - var(--sideW)) 100%,#0000 97%,#000);
    -webkit-mask-composite:source-in;
    mask:radial-gradient(circle 12px at calc(100% - var(--sideW)) 0,#0000 97%,#000),radial-gradient(circle 12px at calc(100% - var(--sideW)) 100%,#0000 97%,#000);
    mask-composite:intersect}
  .stub-main{flex:1;min-width:0;padding:22px 74px 22px 26px;display:flex;flex-direction:column;justify-content:center}
  .stub-lead{font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
  .stub-lead::before{content:'';width:22px;height:2px;background:var(--tc,var(--rust));border-radius:2px}
  .stub-dest{font-size:clamp(34px,6vw,48px);font-weight:700;line-height:1.1;margin-top:8px;word-break:keep-all}
  .stub-country{font-size:17px;color:var(--ink-soft);margin-top:2px}
  .stub-meta{margin-top:14px;font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .stub-meta span{background:var(--hl);padding:1px 8px;border-radius:2px}
  .stub-empty{font-size:17px;line-height:1.9;margin-top:10px}
  .stub-side{position:relative;width:var(--sideW);flex:none;padding:18px 18px 18px 22px;display:flex;align-items:center;justify-content:center;border-left:2px dashed var(--line)}
  .stub-photo{position:relative;width:100%;aspect-ratio:2.2/1;background:#fff;padding:5px;box-shadow:0 1px 3px rgba(0,0,0,.2);transform:rotate(1.6deg)}
  .stub-photo>div,.stub-photo svg{display:block;width:100%;height:100%}
  .stub-photo>div{overflow:hidden;line-height:0}
  .stub-photo::before{content:'';position:absolute;top:-11px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(214,168,78,.62);transform:rotate(-3deg);box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .zodiac{width:100%;height:150px}
  .zodiac svg{width:100%;height:100%}
  .app[data-skin="night"] .zodiac svg{filter:invert(.9) hue-rotate(180deg)}
  .stub .stampy{position:absolute;right:calc(var(--sideW) - 56px);top:50%;margin-top:-56px;z-index:2}

  /* the rubber stamp */
  .stampy{display:grid;place-content:center;justify-items:center;width:112px;height:112px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);
    position:relative;transform:rotate(-9deg);filter:url(#inkrough);mix-blend-mode:multiply;line-height:1;text-align:center;
    animation:thunk .55s cubic-bezier(.2,.9,.3,1.1) .3s both}
  .app[data-skin="night"] .stampy{mix-blend-mode:normal}
  .stampy::before{content:'';position:absolute;inset:5px;border-radius:50%;border:2px solid var(--stamp)}
  .stampy b{font-family:var(--f-num);font-size:48px;font-weight:400;line-height:1;-webkit-text-stroke:1.1px currentColor}
  .stampy small{font-size:16px;font-weight:700;margin-top:3px;-webkit-text-stroke:.5px currentColor}
  .stampy[data-long="true"] b{font-family:var(--f-zh);font-weight:700;font-size:23px}
  .stampy.sm{width:86px;height:86px;border-width:3px;animation:none}
  .stampy.sm b{font-size:34px}
  .stampy.sm[data-long="true"] b{font-size:18px}
  .stampy.sm small{font-size:12px}
  @keyframes thunk{0%{transform:rotate(-9deg) scale(1.7);opacity:0}55%{transform:rotate(-9deg) scale(.95);opacity:1}100%{transform:rotate(-9deg) scale(1);opacity:1}}

  @media(max-width:700px){
    .stub{flex-direction:column;--sideH:170px;
      -webkit-mask:radial-gradient(circle 12px at 0 calc(100% - var(--sideH)),#0000 97%,#000),radial-gradient(circle 12px at 100% calc(100% - var(--sideH)),#0000 97%,#000);
      -webkit-mask-composite:source-in;
      mask:radial-gradient(circle 12px at 0 calc(100% - var(--sideH)),#0000 97%,#000),radial-gradient(circle 12px at 100% calc(100% - var(--sideH)),#0000 97%,#000);
      mask-composite:intersect}
    .stub-main{padding:20px 22px 40px}
    .stub-side{width:100%;height:var(--sideH);border-left:0;border-top:2px dashed var(--line);padding:16px 22px}
    .stub-photo{width:auto;height:100%;aspect-ratio:2.2/1;max-width:100%}
    .stub .stampy{right:18px;top:auto;margin-top:0;bottom:calc(var(--sideH) - 56px);width:96px;height:96px}
    .stub .stampy b{font-size:38px}
    .zodiac{height:100%}
  }

  /* ============ CALENDAR : highlighter bands ============ */
  .calnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 14px}
  .calnav button{width:34px;height:34px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-size:16px;border-radius:50%;line-height:1}
  @media(hover:hover){.calnav button:hover{background:var(--ink);color:var(--paper)}}
  .calnav .rg{font-family:var(--f-num);font-size:17px;min-width:170px;text-align:center}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:700px){.months{grid-template-columns:repeat(2,1fr);gap:10px}}
  @media(max-width:340px){.months{grid-template-columns:1fr}}
  .m{background:var(--pane);padding:10px 8px 8px;user-select:none;-webkit-user-select:none;border-radius:3px;border-top:2px solid var(--ink)}
  .m h4{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 6px}
  .m h4 .mon{display:flex;align-items:baseline;gap:3px;font-size:13px;font-weight:700}
  .m h4 .mon b{font-family:var(--f-num);font-size:26px;font-weight:400;line-height:1}
  .m h4 .mo{font-family:var(--f-num);color:var(--ink-soft);font-size:12px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--ink-soft);text-align:center;margin-bottom:2px}
  .dg{display:grid;grid-template-columns:repeat(7,1fr)}
  .d{position:relative;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:13px;cursor:pointer;touch-action:manipulation}
  .d.blank{visibility:hidden;cursor:default}
  @media(max-width:700px){.d{height:30px;font-size:12px}.d .ring{width:24px}}
  .m{min-width:0}
  .d{min-width:0}
  .d .ring{position:relative;z-index:1;width:26px;max-width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .d.trip::before,.d.sel::before{content:'';position:absolute;left:0;right:0;top:4px;bottom:4px;background:var(--c,var(--gold));opacity:.5;mix-blend-mode:multiply;filter:url(#inkedge)}
  .app[data-skin="night"] .d.trip::before,.app[data-skin="night"] .d.sel::before{mix-blend-mode:normal;opacity:.6}
  .d.trip.bs::before{left:2px;border-radius:14px 3px 3px 14px}
  .d.trip.be::before{right:2px;border-radius:3px 14px 14px 3px}
  .d.trip.bs.be::before{border-radius:14px}
  .d.trip{font-weight:700}
  .d.sel::before{--c:var(--gold);opacity:.75;left:1px;right:1px;border-radius:6px}
  .d.today .ring,.d.today.plain .ring{border:1.6px solid var(--ink);border-radius:52% 48% 50% 50%/48% 52% 48% 52%}
  .d.today.plain{font-weight:700}
  .caltip{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 2px;font-size:13px;color:var(--ink-soft);text-align:center}
  .memobubble{position:fixed;z-index:55;transform:translate(-50%,-100%) rotate(-1.5deg);background:#F6E9A8;color:#2A2A20;padding:10px 14px 11px;max-width:240px;font-size:14px;line-height:1.55;pointer-events:none;box-shadow:0 8px 14px -4px rgba(0,0,0,.35);border-radius:1px 1px 3px 1px}
  .memobubble::before{content:'';position:absolute;top:-7px;left:50%;width:46px;height:14px;margin-left:-23px;background:rgba(198,123,101,.6);transform:rotate(2deg)}
  .memobubble .mtitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
  .memobubble .micon{font-size:14px;line-height:1}
  .memobubble .mdates{font-size:12.5px;color:#6b6a52;margin-top:1px}
  .memobubble .mtext{white-space:pre-wrap;word-break:break-word;margin-top:7px;padding-top:7px;border-top:1px dashed rgba(0,0,0,.25)}

  /* ============ PANELS / RECAP TEASER ============ */
  .panel{background:var(--pane);padding:18px;border:1px solid var(--line);border-radius:3px}
  .recapteaser{display:flex;align-items:center;gap:14px 10px;flex-wrap:wrap}
  .recapteaser .stat{flex:1;min-width:58px;text-align:center}
  .recapteaser .stat .n{font-family:var(--f-num);font-size:36px;line-height:1.1}
  .recapteaser .stat .l{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .genbtn{border:none;background:var(--ink);color:var(--paper);padding:11px 18px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;border-radius:3px}
  @media(max-width:700px){.recapteaser{gap:14px 6px}.recapteaser .stat .n{font-size:30px}.recapteaser .genbtn{width:100%;justify-content:center}}

  /* fab */
  .fab{position:fixed;right:calc(50% - 460px + 22px);bottom:24px;background:var(--rust);color:#fff;border:none;padding:14px 22px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 18px -6px rgba(29,43,58,.5);z-index:15;border-radius:30px}
  .app[data-skin="night"] .fab{color:#1F2A2D;background:var(--stamp)}
  @media(max-width:1010px){.fab{right:18px;bottom:18px}}
  @media(hover:hover){.fab:hover{filter:brightness(1.06)}}

  /* ============ MODALS (bottom sheet on phones) ============ */
  .scrim{position:fixed;inset:0;background:rgba(18,26,30,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
  .modal{width:420px;max-width:100%;max-height:92vh;overflow:auto;position:relative;color:var(--ink);
    background-color:var(--paper);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.7px);background-size:22px 22px;
    border-radius:4px;box-shadow:0 24px 50px -10px rgba(0,0,0,.5)}
  .modal .mbar{background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);color:var(--ink);font-weight:700;font-size:18px;padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;border-bottom:1.5px solid var(--ink)}
  .modal .mbar .x{cursor:pointer;font-size:18px;background:none;border:none;color:var(--ink);width:32px;height:32px}
  .modal .mbody{padding:18px 20px 22px}
  @media(max-width:560px){
    .scrim{align-items:flex-end;padding:0}
    .modal{width:100%!important;max-height:90vh;border-radius:16px 16px 0 0}
  }
  .fld{margin-bottom:18px}
  .fld>label{font-size:13.5px;color:var(--ink-soft);display:block;margin-bottom:4px;font-weight:700}
  .fld input[type=text],.fld input[type=date],.fld input[type=password],.fld select{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--ink);padding:6px 1px;font-size:16px;outline:none;border-radius:0}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--rust);box-shadow:0 2px 0 var(--rust)}
  .fld textarea{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--ink);padding:6px 1px;font-size:16px;outline:none;min-height:56px;resize:vertical;line-height:1.7}
  .f2{display:flex;gap:16px}.f2>.fld{flex:1;min-width:0}
  .seg-in{display:flex;flex-wrap:wrap;gap:8px}
  .chipbtn{background:transparent;border:1.5px solid var(--ink);border-radius:18px;padding:5px 14px;font-size:14px;font-weight:700;color:var(--ink)}
  .chipbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;position:relative}
  .sw.on{outline:2px solid var(--ink);outline-offset:3px}
  .sw.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .mbtns{display:flex;gap:10px;margin-top:8px}
  .btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;font-weight:700;font-size:15px;flex:1;border-radius:3px}
  .btn.ghost{background:transparent;color:var(--ink);flex:0 0 auto}
  .btn.gold{background:var(--hl);color:var(--ink);border-color:var(--ink)}
  .btn.warn{background:transparent;color:var(--red);border-color:transparent;flex:0 0 auto}
  .btn:disabled{opacity:.45}
  .skinopt{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:10px;background:var(--pane);border:1.5px solid var(--line);text-align:left;cursor:pointer;border-radius:3px}
  .skinopt[data-on="true"]{border-color:var(--ink);background:var(--hl)}

  /* ============ DETAIL : the ticket ============ */
  .ticketwrap{margin:4px 20px 0;filter:drop-shadow(0 10px 10px rgba(29,43,58,.16)) drop-shadow(0 1px 0 rgba(29,43,58,.12))}
  .ticket{--sceneH:clamp(150px,28vw,230px);position:relative;overflow:hidden;background:var(--ticket);border-radius:4px;
    -webkit-mask:radial-gradient(circle 12px at 0 var(--sceneH),#0000 97%,#000),radial-gradient(circle 12px at 100% var(--sceneH),#0000 97%,#000);-webkit-mask-composite:source-in;
    mask:radial-gradient(circle 12px at 0 var(--sceneH),#0000 97%,#000),radial-gradient(circle 12px at 100% var(--sceneH),#0000 97%,#000);mask-composite:intersect}
  .ticket .tkscene{height:var(--sceneH);overflow:hidden;line-height:0;border-bottom:2px dashed var(--line);border-top:6px solid var(--tc,var(--rust))}
  .ticket .tkscene svg{width:100%;height:100%;display:block}
  .ticket .tkinfo{position:relative;padding:18px 22px 22px}
  .ticket .tkinfo .stampy{position:absolute;right:20px;top:-46px;z-index:2}
  .ticket .tkcity{font-size:clamp(28px,6vw,38px);font-weight:700;line-height:1.15;padding-right:96px}
  .ticket .tksub{font-size:15px;color:var(--ink-soft);margin-top:6px}
  .ticket .tkpills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ticket .pill{border:1.5px solid var(--ink);padding:3px 12px;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--ink);border-radius:16px}

  .metarow{display:flex;flex-wrap:wrap;align-items:center}
  .ta-view,.ta-edit{font-size:16px;color:var(--ink);line-height:30px;white-space:pre-wrap;padding:0 4px;
    background:repeating-linear-gradient(transparent 0 29px,var(--dot) 29px 30px);background-attachment:local}
  .ta-edit{width:100%;border:none;min-height:90px;resize:vertical;outline:none;border-bottom:1.5px solid var(--ink)}
  .day{margin-bottom:20px}
  .day .dh{padding:0 0 6px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);margin-bottom:12px}
  .day .dc{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
  .chip{padding:3px 2px;font-size:15px;font-weight:700;display:flex;gap:7px;align-items:center}
  .chip .dotc{width:10px;height:10px;border-radius:50%;flex:none}
  .chip .del{color:var(--ink-soft);font-size:12px;background:none;border:none;padding:4px 2px 4px 4px}
  .chip a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .addchip{color:var(--ink);padding:4px 11px;font-size:13px;font-weight:700;background:transparent;border:1.5px dashed var(--ink-soft);border-radius:14px}
  @media(hover:hover){.addchip:hover{border-style:solid;background:var(--hl)}}
  .gmapsbox{margin-top:10px;display:flex;gap:8px}
  .gmapsbox input{flex:1;background:var(--pane);border:none;border-bottom:1.5px solid var(--ink);padding:8px 10px;font-size:14px;outline:none}

  /* ============ RECAP PAGE ============ */
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:18px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:5px 13px;font-size:13.5px;font-weight:700}
  .seg button.on{background:var(--ink);color:var(--paper)}
  .rgrid{display:grid;grid-template-columns:290px 1fr;gap:18px}
  @media(max-width:720px){.rgrid{grid-template-columns:1fr}}
  .stat3{display:flex;gap:10px;margin-bottom:16px}
  .rstat{flex:1;border:1.5px solid var(--ink);padding:12px 6px 10px;text-align:center;border-radius:3px;background:var(--pane)}
  .rstat .n{font-family:var(--f-num);font-size:32px;line-height:1.1}
  .rstat .l{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .clist .c{background:var(--ticket);padding:10px 12px;margin-bottom:8px;cursor:pointer;border:1px solid var(--line);border-left:4px solid var(--rust);border-radius:2px}
  .clist .c .top{display:flex;justify-content:space-between;align-items:center}
  .clist .c .nm{font-size:16px;font-weight:700}
  .clist .c .ct{font-family:var(--f-num);font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
  .cdot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .clist .cities{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
  .citytag{font-size:13.5px;background:var(--hl);padding:2px 10px;display:flex;gap:5px;align-items:center;border:none;border-radius:2px}
  .worldwrap{background:var(--sky-lav);padding:6px;border-radius:3px}
  .genbar{margin:22px 20px 8px;background:var(--ink);color:var(--paper);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-radius:4px}
  .genbar .t{font-weight:700;font-size:17px}
  .genbar .s{font-size:13.5px;opacity:.75;margin-top:2px}
  .genbar .go{border:none;background:var(--rust);color:#fff;padding:10px 20px;font-weight:700;font-size:15px;border-radius:20px}
  .foot{padding:26px 20px 10px;text-align:center}
  .foot .en{font-size:13px;color:var(--ink-soft)}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;font-family:var(--f-num);color:#fff;opacity:.8;font-size:18px}
  .miss{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line)}
  .miss .lbl{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .miss .tags{display:flex;flex-wrap:wrap;gap:6px}

  /* ============ POSTCARDS ============ */
  .album{padding:16px 20px 28px}
  .albumhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .addstk{border:none;background:var(--ink);color:var(--paper);padding:9px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;border-radius:20px}
  .stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:30px 24px;padding:14px 4px}
  .stkcard{background:#fff;padding:9px 9px 0;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 16px -8px rgba(29,43,58,.35);transition:transform .18s}
  .stkcard:nth-child(3n+1){transform:rotate(-1.4deg)}
  .stkcard:nth-child(3n+2){transform:rotate(1deg)}
  .stkcard:nth-child(3n){transform:rotate(-.4deg)}
  .stkcard::before{content:'';position:absolute;top:-10px;left:50%;width:64px;height:20px;margin-left:-32px;background:rgba(198,123,101,.6);transform:rotate(-3deg);z-index:1}
  .stkcard:nth-child(3n+2)::before{background:rgba(90,132,148,.55);transform:rotate(2deg)}
  .stkcard:nth-child(3n)::before{background:rgba(214,168,78,.6)}
  @media(hover:hover){.stkcard:hover{transform:rotate(0) translateY(-4px)}}
  .stkcard img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#e8e4da;cursor:pointer}
  .stkcard .pcap{padding:10px 4px 12px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:700;color:#1D2B3A;white-space:nowrap;overflow:hidden}
  .stkcard .pcap .cdot{width:9px;height:9px;border-radius:50%;flex:none}
  .stkcard .pcap .nm{overflow:hidden;text-overflow:ellipsis}
  .stkcard .del{position:absolute;top:14px;right:14px;background:rgba(29,43,58,.6);color:#fff;border:none;width:26px;height:26px;border-radius:50%;font-size:12px;line-height:1;z-index:2}
  .stkempty{text-align:center;color:var(--ink-soft);padding:56px 20px;font-size:16px;line-height:2}
  .uploadbox{border:2px dashed var(--ink-soft);background:var(--pane);padding:30px;text-align:center;cursor:pointer;font-size:15px;font-weight:700;border-radius:3px}
  .uploadprev{width:100%;border-radius:2px;display:block;max-height:230px;object-fit:contain;background:var(--pane)}
  .lightbox{position:fixed;inset:0;background:rgba(14,20,24,.88);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;cursor:zoom-out}
  .lightbox img{max-width:96%;max-height:92vh;border-radius:3px}
  .stkteaser{cursor:pointer}
  .stkstrip{display:flex;gap:6px;padding:16px 8px 12px;align-items:flex-start;overflow:hidden}
  .stkstrip .mini{background:#fff;padding:5px 5px 7px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 6px 10px -5px rgba(29,43,58,.4);flex:none;position:relative}
  .stkstrip .mini:nth-child(odd){transform:rotate(-3deg)}
  .stkstrip .mini:nth-child(even){transform:rotate(2.2deg) translateY(6px)}
  .stkstrip .mini::before{content:'';position:absolute;top:-8px;left:50%;width:34px;height:14px;margin-left:-17px;background:rgba(198,123,101,.6);transform:rotate(-4deg)}
  .stkstrip .mini:nth-child(3n+2)::before{background:rgba(90,132,148,.55)}
  .stkstrip .mini:nth-child(3n)::before{background:rgba(214,168,78,.6)}
  .stkstrip .mini img{width:104px;height:78px;object-fit:cover;display:block}
  .stkteaser-empty{color:var(--ink-soft);font-size:15px;padding:14px 2px}
  .stkteaser-foot{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  .stkteaser-foot .cnt{font-weight:700;font-size:15px}
  .stkteaser-foot .enter{margin-left:auto;font-weight:700;color:var(--purple);font-size:15px}

  @media(prefers-reduced-motion:reduce){.stampy{animation:none!important}.stkcard{transition:none}}

  /* ================================================================
     SKINS 3 & 4 : 島嶼旅人 (island) / 手繪日誌 (journal)
     Same markup as the default skin; only tokens + a few overrides.
     ================================================================ */
  .app{font-family:var(--f-zh)}

  /* hero text card shared by island + journal */
  .hcard .lead{font-size:clamp(11px,2.3vw,13px);color:var(--purple-deep);font-weight:700;display:flex;align-items:center;gap:5px}
  .hcard .dest{font-weight:900;font-size:clamp(20px,4vw,28px);margin-top:6px;line-height:1.14}
  .hcard .big{margin-top:3px;line-height:1;display:flex;align-items:baseline;gap:6px}
  .hcard .big b{font-family:var(--f-num);font-weight:700;font-size:clamp(46px,9vw,72px);color:var(--rust)}
  .hcard .big small{font-size:clamp(13px,2.7vw,18px);font-weight:700}
  .hcard .big .ongoing{font-weight:900;font-size:clamp(26px,5.4vw,40px);color:var(--teal-deep)}
  .hcard .meta{font-size:clamp(11px,2.3vw,14px);margin-top:8px;font-weight:700}
  .hcard .empty{font-size:clamp(13px,2.8vw,16px);font-weight:700;line-height:1.75}

  /* ---------------- ISLAND : flat, bright, vector ---------------- */
  body:has(.app[data-skin="island"]){--desk:#E6E1D4;--desk-line:transparent}
  .app[data-skin="island"]{
    --paper:#F5F2EB; --pane:rgba(255,255,255,.55); --ticket:#FBF8F0; --dot:transparent; --line:#DED5C1; --hl:rgba(203,183,129,.5);
    --ink:#3B3745; --ink-soft:#7A7382; --stamp:#C67B65;
    --parchment:#EAE4D6; --parchment-lo:#DAD2C1; --appbg:#E6E1D4; --cream:#F5F2EB; --ivory:#FCF8EC;
    --gold:#CBB781; --gold-deep:#AC9A63;
    --purple:#8A7A9C; --purple-deep:#6C5C80;
    --teal:#5B968A; --teal-deep:#457C71;
    --lavender:#C6BDCE; --dusty:#A69CAF; --dusty-deep:#82778E;
    --sage:#8E9E77; --sage-deep:#6C7B54;
    --sky-cream:#E8E3D4; --sky-lav:#C4D4D9; --sky-top:#B1C6CE;
    --sea:#5A8494; --sea-lo:#6E97A6; --brown:#7C6349; --brown-lo:#96795C;
    --rust:#C67B65; --rust-lo:#D3927E; --red:#BE6754;
    --f-zh:'Noto Sans TC','PingFang TC','LXGW WenKai TC',sans-serif; --f-num:'Space Grotesk'; --f-en:'Space Grotesk'; --f-hand:'Space Grotesk';
    background-image:none;
  }
  .app[data-skin="island"]::before{display:none}
  @media(min-width:1000px){.app[data-skin="island"]{margin:0 auto;min-height:100vh;border-radius:0;box-shadow:none;padding-left:0}}
  .app[data-skin="island"] .topbar{background:var(--parchment);backdrop-filter:none;-webkit-backdrop-filter:none}
  .app[data-skin="island"] .topbar .zh{font-weight:900}
  .app[data-skin="island"] .yswitch .arw,.app[data-skin="island"] .gear{background:var(--gold);border:none;border-radius:0;color:var(--ink)}
  .app[data-skin="island"] .gear{background:var(--parchment-lo)}
  @media(hover:hover){.app[data-skin="island"] .yswitch .arw:hover,.app[data-skin="island"] .gear:hover{background:var(--gold-deep);color:var(--cream)}}
  .app[data-skin="island"] .yswitch .cur{font-weight:700}
  .app[data-skin="island"] .backbtn{background:var(--parchment-lo);border:none;border-radius:0}
  @media(hover:hover){.app[data-skin="island"] .backbtn:hover{background:var(--gold);color:var(--ink)}}
  .app[data-skin="island"] .sh{align-items:center}
  .app[data-skin="island"] .sh .zh{background:none;font-weight:900;font-size:17px;padding:0;margin:0}
  .app[data-skin="island"] .sh .r{display:block;height:2px;background:var(--line);flex:1}
  /* island hero : full-bleed scene, text fades in from the left */
  .ihero{position:relative;overflow:hidden;background:var(--sky-cream);height:clamp(230px,32vw,320px)}
  .ihero .scene{position:absolute;inset:0;font-size:0;line-height:0}
  .ihero .scene svg{display:block;width:100%;height:100%}
  .ihero::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#E8E3D4 0%,#E8E3D4 14%,rgba(232,227,212,0) 52%)}
  .ihero .hcard{position:absolute;left:0;top:0;z-index:2;padding:clamp(16px,3vw,26px) clamp(18px,3.4vw,32px);max-width:64%}
  /* calendar : plain round dots */
  .app[data-skin="island"] .m{border-top:0;border-radius:5px}
  .app[data-skin="island"] .m h4 .mon{color:var(--purple-deep)}
  .app[data-skin="island"] .m h4 .mon b{font-weight:700;font-size:20px}
  .app[data-skin="island"] .calnav button{background:var(--parchment-lo);border:none;border-radius:4px}
  @media(hover:hover){.app[data-skin="island"] .calnav button:hover{background:var(--gold);color:var(--ink)}}
  .app[data-skin="island"] .d.trip::before,.app[data-skin="journal"] .d.trip::before,.app[data-skin="island"] .d.sel::before,.app[data-skin="journal"] .d.sel::before{
    left:50%;right:auto;top:50%;bottom:auto;width:25px;height:25px;margin:-12.5px 0 0 -12.5px;border-radius:50%;opacity:1;mix-blend-mode:normal}
  .app[data-skin="island"] .d.trip::before,.app[data-skin="island"] .d.sel::before{filter:none}
  .app[data-skin="island"] .d.trip .ring,.app[data-skin="journal"] .d.trip .ring{color:#fff}
  .app[data-skin="island"] .d.sel .ring,.app[data-skin="journal"] .d.sel .ring{color:var(--ink)}
  .app[data-skin="island"] .d.today .ring,.app[data-skin="island"] .d.today.plain .ring{border-color:var(--purple);border-radius:50%}
  .app[data-skin="island"] .memobubble{background:var(--ink);color:var(--cream);transform:translate(-50%,-100%);border-radius:9px}
  .app[data-skin="island"] .memobubble::before{display:none}
  .app[data-skin="island"] .memobubble::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
  .app[data-skin="island"] .memobubble .mdates{color:#C9C3D4}
  .app[data-skin="island"] .memobubble .mtext{border-top:1px solid rgba(255,255,255,.18)}
  /* panels & buttons : flat blocks */
  .app[data-skin="island"] .panel{background:var(--parchment);border:0;border-radius:0}
  .app[data-skin="island"] .genbtn{background:var(--teal);color:#fff;border-radius:0}
  .app[data-skin="island"] .fab{border-radius:2px;color:#fff}
  .app[data-skin="island"] .btn{background:var(--purple);border-color:var(--purple);color:#fff;border-radius:0}
  .app[data-skin="island"] .btn.ghost{background:var(--parchment-lo);border-color:var(--parchment-lo);color:var(--ink)}
  .app[data-skin="island"] .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .app[data-skin="island"] .btn.warn{background:transparent;border-color:transparent;color:var(--red)}
  .app[data-skin="island"] .chipbtn{border-color:var(--line);color:var(--ink-soft)}
  .app[data-skin="island"] .chipbtn.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .app[data-skin="island"] .addstk{background:var(--purple);border-radius:0;color:#fff}
  .app[data-skin="island"] .modal{background-image:none;background-color:var(--ivory)}
  .app[data-skin="island"] .modal .mbar{background:var(--purple);color:var(--cream);border-bottom:0;backdrop-filter:none}
  .app[data-skin="island"] .modal .mbar .x{color:var(--cream)}
  .app[data-skin="island"] .skinopt[data-on="true"]{border-color:var(--purple);background:var(--parchment-lo)}
  .app[data-skin="island"] .rstat{background:var(--cream);border:0;border-radius:0}
  .app[data-skin="island"] .seg{border:0;background:var(--cream);border-radius:0}
  .app[data-skin="island"] .seg button.on{background:var(--gold);color:var(--ink)}
  .app[data-skin="island"] .genbar{background:var(--teal-deep);border-radius:0}
  .app[data-skin="island"] .genbar .go{background:var(--gold);color:var(--ink);border-radius:0}
  .app[data-skin="island"] .citytag{background:var(--parchment)}
  .app[data-skin="island"] .clist .c{border-radius:0}
  .app[data-skin="island"] .addchip{border-style:solid;border-color:transparent;background:var(--parchment-lo);color:var(--gold-deep)}
  .app[data-skin="island"] .ticketwrap{margin:0;filter:none}
  .app[data-skin="island"] .ticket{border-radius:0;-webkit-mask:none;mask:none;background:var(--paper)}
  .app[data-skin="island"] .ticket .tkscene{border-top:0;border-bottom:0}
  .app[data-skin="island"] .ticket .tkinfo{border-top:2px dashed var(--line)}
  .app[data-skin="island"] .ticket .pill{border:0;background:var(--cream);border-radius:0}
  .app[data-skin="island"] .ticket .tkinfo .stampy{top:16px}
  .app[data-skin="island"] .stampy{border:none;filter:none;mix-blend-mode:normal;animation:none;transform:none;width:auto;height:auto;color:var(--rust);display:block;text-align:right}
  .app[data-skin="island"] .stampy::before{display:none}
  .app[data-skin="island"] .stampy b{font-size:40px;font-weight:700;-webkit-text-stroke:0}
  .app[data-skin="island"] .stampy small{margin-left:4px;color:var(--ink-soft);-webkit-text-stroke:0;font-size:13px}
  .app[data-skin="island"] .stampy[data-long="true"] b{font-size:22px}
  .app[data-skin="island"] .ta-view,.app[data-skin="island"] .ta-edit{background:none;line-height:1.9}
  .app[data-skin="island"] .day .dh{border-bottom:1px solid var(--line)}
  .app[data-skin="island"] .stkcard,.app[data-skin="island"] .stkstrip .mini{transform:none}
  .app[data-skin="island"] .stkcard::before,.app[data-skin="island"] .stkstrip .mini::before{display:none}
  .app[data-skin="island"] .stkstrip .mini:nth-child(even){transform:none}
  .app[data-skin="island"] .stkcard .del{top:12px;right:12px}
  .app[data-skin="island"] .scrim{background:rgba(40,36,50,.42)}

  /* ---------------- JOURNAL : white paper, black ink, hand-drawn ---------------- */
  body:has(.app[data-skin="journal"]){--desk:#EAE9E4;--desk-line:transparent}
  .app[data-skin="journal"]{
    --paper:#FFFFFF; --pane:#FAFAF7; --ticket:#FFFFFF; --dot:transparent; --line:#C4C4BE; --hl:rgba(90,127,176,.22);
    --ink:#1F1A14; --ink-soft:#5C5247; --stamp:#C44536;
    --parchment:#F0EFE9; --parchment-lo:#E4E3DB; --appbg:#FFFFFF; --cream:#FFFFFF; --ivory:#FEFEFC;
    --gold:#5A7FB0; --gold-deep:#48688F;
    --purple:#6B5B7A; --purple-deep:#544665;
    --teal:#4F6E5B; --teal-deep:#3D5748;
    --sage:#6B7A3F; --sage-deep:#556030;
    --rust:#C44536; --rust-lo:#D25A4A; --red:#C44536;
    --f-zh:'LXGW WenKai TC','Noto Sans TC',sans-serif; --f-num:'Caveat'; --f-en:'Caveat'; --f-hand:'Caveat';
    background-image:none;
  }
  .app[data-skin="journal"]::before{display:none}
  @media(min-width:1000px){.app[data-skin="journal"]{padding-left:0}}
  .app[data-skin="journal"] .topbar{border-bottom:1.5px dashed var(--line)}
  .app[data-skin="journal"] .yswitch .cur{font-size:28px;font-weight:700}
  .app[data-skin="journal"] .topbar .sub{font-family:'Caveat',var(--f-zh);font-size:15px;font-style:italic}
  .app[data-skin="journal"] .sh .r{display:block;height:0;border-top:1.5px dashed var(--line);flex:1}
  .app[data-skin="journal"] .sh .e{font-family:'Caveat',var(--f-zh);font-style:italic;font-size:16px}
  .app[data-skin="journal"] :is(.backbtn,.btn,.genbtn,.chipbtn,.addchip,.addstk,.fab,.genbar .go,.ticket .pill){border-radius:255px 14px 225px 14px/14px 225px 14px 255px}

async function geocode(location,country){
  const loc=(location||'').trim(),cty=(country||'').trim();
  if(!loc)return null;
  if(LOCATION_COORDS[loc])return{...LOCATION_COORDS[loc],country:CITY_COUNTRY[loc]||cty||null};
  try{
    const q=cty?`${loc} ${cty}`:loc;
    const res=await fetch(`https://nominatim.openstreetmap.org/search?${new URLSearchParams({q,format:'json',limit:'1','accept-language':'zh-TW,en',addressdetails:'1'})}`);
    if(res.ok){const data=await res.json();if(Array.isArray(data)&&data.length){const lat=parseFloat(data[0].lat),lng=parseFloat(data[0].lon);if(!isNaN(lat)&&!isNaN(lng))return{lat,lng,country:data[0].address&&data[0].address.country||cty||null};}}
  }catch(e){}
  if(cty&&COUNTRY_COORDS[cty])return{...COUNTRY_COORDS[cty]};
  return null;
}

/* ============ CALENDAR ============ */
function Calendar({start,trips,onCreate,onOpenTrip,onShift}){
  const [drag,setDrag]=useState(null); // {start, cur}
  const [hoverMemo,setHoverMemo]=useState(null); // {memo,name,color,x,y}
  const today=todayStr();
  // 6 months from the anchor (start)
  const months=[];
  for(let i=0;i<6;i++){const tot=start.y*12+start.m+i;months.push({y:Math.floor(tot/12),m:((tot%12)+12)%12});}
  const last=months[5];

  const tripByDate={};
  trips.forEach(t=>{daysBetween(t.startDate,t.endDate).forEach(d=>{if(!tripByDate[d])tripByDate[d]=t;});});

  const endDrag=()=>{
    if(drag&&drag.start&&drag.cur){
      const[a,b]=drag.start<=drag.cur?[drag.start,drag.cur]:[drag.cur,drag.start];
      onCreate(a,b);
    }
    setDrag(null);
  };
  useEffect(()=>{
    if(!drag)return;
    const up=()=>endDrag();
    window.addEventListener('mouseup',up);
    return()=>{window.removeEventListener('mouseup',up);};
  });

  const inSel=(ds)=>{if(!drag)return false;const[a,b]=drag.start<=drag.cur?[drag.start,drag.cur]:[drag.cur,drag.start];return ds>=a&&ds<=b;};
  const DOW=['日','一','二','三','四','五','六'];

  return (
    <div>
    <div className="calnav">
      <button onClick={()=>onShift(-6)} aria-label="上半年">‹</button>
      <span className="rg">{start.y}/{pad(start.m+1)} – {last.y}/{pad(last.m+1)}</span>
      <button onClick={()=>onShift(6)} aria-label="下半年">›</button>
    </div>
    <div className="months">
      {months.map(({y,m},mi)=>{
        const first=new Date(y,m,1).getDay();
        const dim=new Date(y,m+1,0).getDate();
        const cells=[];
        for(let b=0;b<first;b++)cells.push(<div key={'b'+b} className="d blank"/>);
        for(let d=1;d<=dim;d++){
          const ds=fmtDate(y,m,d);
          const tr=tripByDate[ds];
          const isToday=ds===today;
          const sel=inSel(ds);
          let cls='d';
          if(tr)cls+=' trip';
          if(isToday)cls+=tr?' today':' today plain';
          if(sel)cls+=' sel';
          const wd=(first+d-1)%7;
          const prv=tripByDate[fmtDate(y,m,d-1)],nxt=tripByDate[fmtDate(y,m,d+1)];
          if(tr){
            if(!prv||prv.id!==tr.id||wd===0)cls+=' bs';
            if(!nxt||nxt.id!==tr.id||wd===6||d===dim)cls+=' be';
          }
          const handleDown=(e)=>{
            if(tr){onOpenTrip(tr.id);return;}
            setDrag({start:ds,cur:ds});
          };
          const handleEnter=(e)=>{
            if(drag)setDrag(dr=>({...dr,cur:ds}));
            if(tr){const r=e.currentTarget.getBoundingClientRect();setHoverMemo({memo:tr.memo||'',name:tr.location,purpose:migratePurpose(tr.purpose),dates:fmtRange(tr.startDate,tr.endDate),x:r.left+r.width/2,y:r.top});}
          };
          const handleLeave=()=>{if(tr)setHoverMemo(null);};
          cells.push(
            <div key={ds} className={cls} style={tr?{'--c':tr.color}:undefined}
              onMouseDown={handleDown} onMouseEnter={handleEnter} onMouseLeave={handleLeave}>
              <span className="ring">{d}</span>
            </div>
          );
        }
        return (
          <div key={y+'-'+m} className="m">
            <h4><span className="mon"><b>{pad(m+1)}</b>月</span><span className="mo">{y}</span></h4>
            <div className="dow">{DOW.map((x,i)=><div key={i}>{x}</div>)}</div>
            <div className="dg">{cells}</div>
          </div>
        );
      })}
    </div>
    {hoverMemo&&(
      <div className="memobubble" style={{left:hoverMemo.x,top:hoverMemo.y-8}}>
        <div className="mtitle"><span className="micon">{(PURPOSE[hoverMemo.purpose]||{}).icon||'📍'}</span>{hoverMemo.name}</div>
        <div className="mdates">{(PURPOSE[hoverMemo.purpose]||{}).label} · {hoverMemo.dates}</div>
        {hoverMemo.memo&&<div className="mtext">✎ {hoverMemo.memo}</div>}
      </div>
    )}
    </div>
  );
}

/* ============ TRIP MODAL (create + edit) ============ */
function TripModal({initial,onClose,onSave,onDelete}){
  const isEdit=!!initial.id;
  const [location,setLocation]=useState(initial.location||'');
  const [country,setCountry]=useState(initial.country||'');
  const autoRef=useRef(!initial.country); // eligible for auto-country until user edits it manually
  // instant auto-fill country from known-city dictionary as the city is typed
  useEffect(()=>{const c=CITY_COUNTRY[location.trim()];if(c&&(country===''||autoRef.current)){setCountry(c);autoRef.current=true;}},[location]);
  // for cities not in the dictionary, geocode on blur to fill country
  const onCityBlur=async()=>{const loc=location.trim();if(!loc||CITY_COUNTRY[loc])return;if(country===''||autoRef.current){const g=await geocode(loc,'');if(g&&g.country){setCountry(g.country);autoRef.current=true;}}};
  const [startDate,setStartDate]=useState(initial.startDate);
  const [endDate,setEndDate]=useState(initial.endDate);
  const [purpose,setPurpose]=useState(migratePurpose(initial.purpose)||'overseasLeisure');
  const [transport,setTransport]=useState(initial.transport&&TRANSPORT[initial.transport]?initial.transport:(initial.transport?'custom':'cruise'));
  const [customTransport,setCustomTransport]=useState(initial.transport&&!TRANSPORT[initial.transport]?initial.transport:'');
  const initComp=initial.companion||'';
  const [companion,setCompanion]=useState(initComp.startsWith('other:')?'other':initComp||'');
  const [companionOther,setCompanionOther]=useState(initComp.startsWith('other:')?initComp.slice(6):'');
  const [mood,setMood]=useState(initial.mood||'');
  const _ip=migratePurpose(initial.purpose)||'overseasLeisure';
  const [color,setColor]=useState(initial.colorCustom?(initial.color||PURPOSE[_ip].color):PURPOSE[_ip].color);
  const [memo,setMemo]=useState(initial.memo||'');
  const colorAuto=useRef(!initial.colorCustom); // 顏色跟類別走，除非使用者手動選色
  const pickPurpose=(k)=>{setPurpose(k);if(colorAuto.current)setColor(PURPOSE[k].color);};
  const [saving,setSaving]=useState(false);

  const save=async()=>{
    if(!location.trim())return;
    setSaving(true);
    const finalTransport=transport==='custom'?(customTransport.trim()||'其他'):transport;
    const finalCompanion=companion==='other'?('other:'+companionOther.trim()):companion;
    const geo=await geocode(location,country);
    const trip={
      id:initial.id||newId(),
      location:location.trim(),
      country:(geo&&geo.country)||country.trim()||CITY_COUNTRY[location.trim()]||'',
      startDate,endDate,color,purpose,
      transport:finalTransport,companion:finalCompanion,mood:mood||null,
      colorCustom:!colorAuto.current,
      memo:memo.trim(),
      summary:initial.summary||'',dailyPlaces:initial.dailyPlaces||{},
      lat:geo?geo.lat:(initial.lat),lng:geo?geo.lng:(initial.lng),
    };
    onSave(trip);
  };

  return (
    <div className="scrim" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <div className="mbar"><span>{isEdit?'編輯旅程':'新增旅程'} · {fmtRange(startDate,endDate)}</span><button className="x" onClick={onClose}>✕</button></div>
        <div className="mbody">
          <div className="f2">
            <div className="fld"><label>城市</label><input type="text" value={location} onChange={e=>setLocation(e.target.value)} onBlur={onCityBlur} placeholder="例：東京" autoFocus/></div>
            <div className="fld"><label>國家</label><input type="text" value={country} onChange={e=>{autoRef.current=false;setCountry(e.target.value);}} placeholder="輸入城市後自動判定"/></div>
          </div>
          <div className="f2">
            <div className="fld"><label>開始</label><input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}/></div>
            <div className="fld"><label>結束</label><input type="date" value={endDate} min={startDate} onChange={e=>setEndDate(e.target.value)}/></div>
          </div>
          <div className="fld"><label>旅行類別</label>
            <div className="seg-in">{PURPOSE_ORDER.map(k=><button key={k} className={'chipbtn'+(purpose===k?' on':'')} onClick={()=>pickPurpose(k)}>{PURPOSE[k].label}</button>)}</div>
          </div>
          <div className="fld"><label>交通</label>
            <div className="seg-in">
              {Object.keys(TRANSPORT).map(k=><button key={k} className={'chipbtn'+(transport===k?' on':'')} onClick={()=>setTransport(k)}>{TRANSPORT[k].emoji} {TRANSPORT[k].label}</button>)}
              <button className={'chipbtn'+(transport==='custom'?' on':'')} onClick={()=>setTransport('custom')}>✎ 自訂</button>
            </div>
            {transport==='custom'&&<input style={{marginTop:8}} type="text" value={customTransport} onChange={e=>setCustomTransport(e.target.value)} placeholder="輸入交通方式，例：自駕、機車環島"/>}
          </div>
          <div className="fld"><label>同行</label>
            <div className="seg-in">
              {COMPANIONS.map(([k,l])=><button key={k} className={'chipbtn'+(companion===k?' on':'')} onClick={()=>setCompanion(k)}>{l}</button>)}
              <button className={'chipbtn'+(companion==='other'?' on':'')} onClick={()=>setCompanion('other')}>✎ 其他</button>
            </div>
            {companion==='other'&&<input style={{marginTop:8}} type="text" value={companionOther} onChange={e=>setCompanionOther(e.target.value)} placeholder="輸入同行對象"/>}
          </div>
          <div className="f2">
            <div className="fld"><label>心情</label>
              <div className="seg-in">{MOODS.map(e=><button key={e} className={'chipbtn'+(mood===e?' on':'')} style={{fontSize:16,padding:'5px 9px'}} onClick={()=>setMood(mood===e?'':e)}>{e}</button>)}</div>
            </div>
          </div>
          <div className="fld"><label>顏色</label>
            <div className="swatches">{PALETTE.map(c=><button key={c} className={'sw'+(color===c?' on':'')} style={{background:c}} onClick={()=>{colorAuto.current=false;setColor(c);}}/>)}</div>
          </div>
          <div className="fld"><label>備忘（滑鼠移到日曆上這段旅程會顯示）</label>
            <textarea value={memo} onChange={e=>setMemo(e.target.value)} placeholder="例：訂了海景房、記得帶轉接頭…"/>
          </div>
          <div className="mbtns">
            <button className="btn" onClick={save} disabled={saving||!location.trim()}>{saving?'儲存中…':(isEdit?'儲存變更':'建立旅程')}</button>
            {isEdit&&<button className="btn warn" onClick={()=>{if(confirm('確定刪除這段旅程？'))onDelete(initial.id);}}>刪除</button>}
            <button className="btn ghost" onClick={onClose}>取消</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ DETAIL ============ */
function Detail({trip,onBack,onEdit,onUpdate}){
  const [summary,setSummary]=useState(trip.summary||'');
  const [editingSum,setEditingSum]=useState(false);
  const days=daysBetween(trip.startDate,trip.endDate);
  const dp=trip.dailyPlaces||{};
  const [adding,setAdding]=useState(null); // {date,type}
  const [nameInput,setNameInput]=useState('');
  const [gmapsFor,setGmapsFor]=useState(null);
  const [gmapsVal,setGmapsVal]=useState('');
  const placeCount=Object.values(trip.dailyPlaces||{}).reduce((a,l)=>a+l.length,0);
  const [itinOpen,setItinOpen]=useState(placeCount>0);

  const commitSummary=()=>{setEditingSum(false);if(summary!==trip.summary)onUpdate({...trip,summary});};
  const addPlace=(date,type,name,gmapsUrl)=>{
    const places={...dp};const list=(places[date]||[]).slice();
    list.push({id:newPlaceId(),type,name:name.trim(),gmapsUrl:gmapsUrl||null});
    places[date]=list;onUpdate({...trip,dailyPlaces:places});
  };
  const removePlace=(date,id)=>{
    const places={...dp};places[date]=(places[date]||[]).filter(p=>p.id!==id);onUpdate({...trip,dailyPlaces:places});
  };
  const submitAdd=()=>{
    if(adding&&nameInput.trim()){addPlace(adding.date,adding.type,nameInput);}
    setAdding(null);setNameInput('');
  };
  const submitGmaps=(date)=>{
    if(isGmapsUrl(gmapsVal)){const nm=parseGmapsUrl(gmapsVal);if(nm)addPlace(date,'sight',nm,gmapsVal);}
    setGmapsFor(null);setGmapsVal('');
  };
  const p=PURPOSE[migratePurpose(trip.purpose)];
  const tp=TRANSPORT[trip.transport];
  const compLabel=(()=>{const c=trip.companion||'';if(c.startsWith('other:'))return c.slice(6);const f=COMPANIONS.find(x=>x[0]===c);return f?f[1]:'';})();
  const sceneTp=TRANSPORT[trip.transport]?trip.transport:'cruise';
  const _du=daysUntil(trip.startDate);
  const cd=_du>0?{n:_du,l:'天後'}:(trip.endDate>=todayStr()?{n:'進行中',l:''}:{n:tripLength(trip),l:'天'});

  return (
    <div>
      <div className="topbar">
        <button className="backbtn" onClick={onBack}>‹ 返回</button>
        <div style={{marginLeft:'auto',display:'flex',gap:9,alignItems:'center'}}>
          <a className="backbtn" href={mapsUrl(trip.location,trip.country)} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>地圖</a>
          <button className="btn gold" style={{padding:'8px 16px',flex:'none'}} onClick={onEdit}>編輯</button>
        </div>
      </div>

      <div className="ticketwrap"><div className="ticket" style={{'--tc':trip.color}}>
        <div className="tkscene" dangerouslySetInnerHTML={{__html:sceneSVG(sceneTp,trip.country,'xMidYMax slice')}}/>
        <div className="tkinfo">
          <div className="stampy sm" data-long={String(cd.n).length>2}><b>{cd.n}</b>{cd.l&&<small>{cd.l}</small>}</div>
          <div className="tkcity">{trip.location}{trip.country?` · ${trip.country}`:''}</div>
          <div className="tksub">{fmtRange(trip.startDate,trip.endDate)} · {tripLength(trip)} 天</div>
          <div className="tkpills">
            {p&&<span className="pill" style={{background:p.color,color:'var(--cream)'}}>{p.label}</span>}
            <span className="pill">{tp?`${tp.emoji} ${tp.label}`:`🧭 ${trip.transport||'—'}`}</span>
            {compLabel&&<span className="pill">👥 {compLabel}</span>}
            {trip.mood&&<span className="pill">{trip.mood}</span>}
          </div>
        </div>
      </div></div>

      <div className="sh"><span className="zh">摘要</span><span className="r"/></div>
      <div className="pad">
        {editingSum?(
          <textarea className="ta-edit" value={summary} autoFocus onChange={e=>setSummary(e.target.value)} onBlur={commitSummary} placeholder="寫下這趟旅程的心得 / 備註…"/>
        ):(
          <div className="ta-view" onClick={()=>setEditingSum(true)} style={{cursor:'text',minHeight:24,color:summary?'var(--ink)':'var(--ink-soft)'}}>{summary||'點此新增摘要…'}</div>
        )}
      </div>

      <div className="sh" style={{cursor:'pointer',userSelect:'none'}} onClick={()=>setItinOpen(o=>!o)}>
        <span className="zh">每日行程</span><span className="e">選填</span><span className="r"/>
        <span style={{fontSize:12,fontWeight:700,color:'var(--purple)'}}>{itinOpen?'收合 ▾':(placeCount>0?`${placeCount} 個地點 ▸`:'展開安排 ▸')}</span>
      </div>
      {itinOpen&&<div className="pad" style={{paddingBottom:16}}>
        {days.map((ds,i)=>{
          const list=dp[ds]||[];
          const sorted=[...list].sort((a,b)=>PLACE_ORDER.indexOf(a.type)-PLACE_ORDER.indexOf(b.type));
          return (
            <div className="day" key={ds}>
              <div className="dh"><span>{fmtLabel(ds)} · 第 {i+1} 天</span></div>
              <div className="dc">
                {sorted.map(pl=>{
                  const pt=PLACE_TYPES[pl.type]||PLACE_TYPES.other;
                  return (
                    <span className="chip" key={pl.id}>
                      <span className="dotc" style={{background:pt.color}}/>
                      {pl.gmapsUrl?<a href={pl.gmapsUrl} target="_blank" rel="noreferrer">{pl.name}</a>:pl.name}
                      <button className="del" onClick={()=>removePlace(ds,pl.id)}>✕</button>
                    </span>
                  );
                })}
                {adding&&adding.date===ds?(
                  <span className="chip" style={{background:'var(--parchment-lo)',padding:'2px 6px'}}>
                    <span className="dotc" style={{background:(PLACE_TYPES[adding.type]||PLACE_TYPES.other).color}}/>
                    <input autoFocus value={nameInput} onChange={e=>setNameInput(e.target.value)}
                      onKeyDown={e=>{if(e.key==='Enter')submitAdd();if(e.key==='Escape'){setAdding(null);setNameInput('');}}}
                      onBlur={submitAdd} placeholder={(PLACE_TYPES[adding.type]||{}).label+'名稱'}
                      style={{border:'none',background:'transparent',outline:'none',fontSize:13,width:110,color:'var(--ink)'}}/>
                  </span>
                ):(
                  PLACE_ORDER.map(tk=><button key={tk} className="addchip" onClick={()=>{setAdding({date:ds,type:tk});setNameInput('');}}>＋ {PLACE_TYPES[tk].label}</button>)
                )}
              </div>
              {gmapsFor===ds?(
                <div className="gmapsbox">
                  <input autoFocus value={gmapsVal} onChange={e=>setGmapsVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submitGmaps(ds);}} placeholder="貼上 Google Maps 連結…"/>
                  <button className="addchip" onClick={()=>submitGmaps(ds)}>匯入</button>
                  <button className="addchip" onClick={()=>{setGmapsFor(null);setGmapsVal('');}}>取消</button>
                </div>
              ):(
                <div className="gmapsbox"><button className="addchip" onClick={()=>{setGmapsFor(ds);setGmapsVal('');}} style={{background:'transparent',color:'var(--ink-soft)'}}>📋 貼 Google Maps 連結匯入地點</button></div>
              )}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

function WorldMap({trips,onOpenTrip}){
  const withC=trips.filter(t=>typeof t.lat==='number'&&typeof t.lng==='number');
  const without=trips.filter(t=>typeof t.lat!=='number'||typeof t.lng!=='number');
  const groups={};
  withC.forEach(t=>{const k=`${t.lat.toFixed(2)},${t.lng.toFixed(2)}`;if(!groups[k])groups[k]={lat:t.lat,lng:t.lng,name:t.location,trips:[]};groups[k].trips.push(t);});
  const pts=Object.values(groups).map(p=>{const s=[...p.trips].sort((a,b)=>b.startDate.localeCompare(a.startDate));return{...p,color:s[0].color,size:Math.min(9,5+Math.floor(p.trips.length*0.8))};});
  const [hover,setHover]=useState(null);
  const [world,setWorld]=useState(false);
  const vb=world?'0 0 1000 500':'560 60 460 320';
  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:6}}>
        <button className="chipbtn" onClick={()=>setWorld(v=>!v)} style={{background:'var(--parchment)',fontSize:11,padding:'4px 10px'}}>{world?'🗾 聚焦亞洲':'🌍 全球視野'}</button>
      </div>
      <div className="worldwrap">
      <svg viewBox={vb} style={{width:'100%',height:'auto',display:'block',maxHeight:420}}>
        <Continents/>
        {pts.map((p,i)=>{const{x,y}=project(p.lat,p.lng);const h=hover===i;return (
          <g key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} onClick={()=>p.trips.length===1&&onOpenTrip(p.trips[0].id)} style={{cursor:p.trips.length===1?'pointer':'default'}}>
            <circle cx={x} cy={y} r={p.size+5} fill={p.color} opacity={h?0.4:0.22}/>
            <circle cx={x} cy={y} r={p.size} fill={p.color} stroke="var(--cream)" strokeWidth="1.5"/>
            {p.trips.length>1&&<text x={x} y={y+1} textAnchor="middle" dominantBaseline="middle" fill="#fff" style={{fontFamily:"var(--f-num)",fontSize:p.size+2,fontWeight:700,pointerEvents:'none'}}>{p.trips.length}</text>}
          </g>
        );})}
        {hover!==null&&pts[hover]&&(()=>{const p=pts[hover];const{x,y}=project(p.lat,p.lng);const days=p.trips.reduce((s,t)=>s+tripLength(t),0);const txt=`${p.name} · ${p.trips.length} 段 · ${days} 天`;const w=Math.max(120,txt.length*13);const lx=Math.min(Math.max(x-w/2,10),1000-w-10);const ly=y-p.size-30;return (<g pointerEvents="none"><rect x={lx} y={ly} width={w} height={24} rx={3} fill="var(--ink)"/><text x={lx+w/2} y={ly+16} textAnchor="middle" fill="#fff" style={{fontSize:13,fontWeight:600}}>{txt}</text></g>);})()}
      </svg>
      </div>
      {without.length>0&&(
        <div className="miss">
          <div className="lbl">未標示位置 · {without.length} 段</div>
          <div className="tags">{without.map(t=><button key={t.id} className="citytag" onClick={()=>onOpenTrip(t.id)}><span className="cdot" style={{background:t.color}}/>{t.location}</button>)}</div>
        </div>
      )}
    </div>
  );
}

/* ============ RECAP ============ */
function Recap({year,trips,onBack,onOpenTrip}){
  const [range,setRange]=useState('full');
  const bounds=(()=>{
    if(range==='h1')return[`${year}-01-01`,`${year}-06-30`];
    if(range==='h2')return[`${year}-07-01`,`${year}-12-31`];
    return[`${year}-01-01`,`${year}-12-31`];
  })();
  const yTrips=trips.filter(t=>overlapDays(t,bounds[0],bounds[1])>0);
  const totalDays=yTrips.reduce((s,t)=>s+overlapDays(t,bounds[0],bounds[1]),0);
  const totalPlaces=yTrips.reduce((s,t)=>s+Object.values(t.dailyPlaces||{}).reduce((a,l)=>a+l.length,0),0);
  const [expanded,setExpanded]=useState(null);
  // country -> cities
  const countries={};
  yTrips.forEach(t=>{const c=t.country||'其他';if(!countries[c])countries[c]={visits:0,cities:{}};countries[c].visits++;const city=t.location;countries[c].cities[city]=(countries[c].cities[city]||0)+1;});
  const countryList=Object.entries(countries).sort((a,b)=>b[1].visits-a[1].visits);

  const genAnim=()=>{alert(`🎬「${OWNER} 的 ${year} Trips」動畫產出功能開發中，敬請期待！`);};

  return (
    <div>
      <div className="topbar">
        <button className="backbtn" onClick={onBack}>‹ 返回</button>
        <div style={{marginLeft:6}}><div className="zh" style={{fontSize:19}}>{year} 年度回顧</div></div>
        <div className="seg" style={{marginLeft:'auto'}}>
          {[['full','全年'],['h1','上半年'],['h2','下半年']].map(([k,l])=><button key={k} className={range===k?'on':''} onClick={()=>setRange(k)}>{l}</button>)}
        </div>
      </div>
      <div className="pad" style={{paddingTop:18}}>
        <div className="rgrid">
          <div>
            <div className="stat3">
              <div className="rstat"><div className="n">{yTrips.length}</div><div className="l">旅程段數</div></div>
              <div className="rstat"><div className="n">{totalPlaces}</div><div className="l">造訪地點</div></div>
              <div className="rstat"><div className="n">{totalDays}</div><div className="l">在外天數</div></div>
            </div>
            <div className="panel">
              <div style={{fontWeight:900,fontSize:13,marginBottom:9}}>國家清單 · 點擊展開城市</div>
              <div className="clist">
                {countryList.length===0&&<div style={{fontSize:13,color:'var(--ink-soft)'}}>這段期間還沒有旅程</div>}
                {countryList.map(([c,info])=>(
                  <div className="c" key={c} onClick={()=>setExpanded(expanded===c?null:c)}>
                    <div className="top"><span className="nm">{c}</span><span className="ct">{Array.from({length:Math.min(info.visits,5)}).map((_,i)=><span key={i} className="cdot" style={{background:'var(--rust)'}}/>)} {info.visits}</span></div>
                    {expanded===c&&<div className="cities">{Object.entries(info.cities).map(([city,n])=><span className="citytag" key={city}>{city}{n>1?` ×${n}`:''}</span>)}</div>}
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="panel" style={{padding:12}}>
            <WorldMap trips={yTrips} onOpenTrip={onOpenTrip}/>
          </div>
        </div>
      </div>
      <div className="genbar">
        <div><div className="t">一鍵產出動畫</div><div className="s">產出「{OWNER} 的 {year} Trips」該年度所有行程演示</div></div>
        <button className="go" onClick={genAnim}>產出動畫</button>
      </div>
      <div className="foot"><div className="en">© {OWNER} LIN · {year}</div></div>
    </div>
  );
}

        <div style={{marginLeft:6}}><div className="zh" style={{fontSize:19}}>明信片收集冊</div></div>
        <button className="addstk" style={{marginLeft:'auto'}} onClick={onAdd}>＋ 加入明信片</button>
      </div>
      <div className="album">
        {stickers.length===0?(

        ):(
          <div className="stkgrid">
            {stickers.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).map(s=>{const t=tripById[s.tripId];return (

                  <span className="nm">{s.title||(t?t.location:'旅行')}{t?` · ${fmtLabel(t.startDate)}`:''}</span>

}
function AddStickerModal({trips,onClose,onSave,geminiKey,onNeedKey}){
  const [rawImg,setRawImg]=useState(null); // 上傳的原始照片
  const [card,setCard]=useState(null);     // 產出的明信片
  const [tripId,setTripId]=useState('');
  const [title,setTitle]=useState('');
  const [busy,setBusy]=useState(false);
  const [gen,setGen]=useState(false);
  const [err,setErr]=useState('');
  const [copied,setCopied]=useState(false);
  const fileRef=useRef(null);
  const pick=(e)=>{const f=e.target.files&&e.target.files[0];useImageFile(f);};
  const generate=async()=>{if(!rawImg)return;if(!geminiKey){onNeedKey();return;}setGen(true);setErr('');try{const out=await geminiPostcard(rawImg,geminiKey);const small=await shrinkDataURL(out,1280,0.86);setCard(small);}catch(e){setErr(String(e.message||e));}setGen(false);};
  const copyPrompt=()=>{try{navigator.clipboard.writeText(POSTCARD_PROMPT);setCopied(true);setTimeout(()=>setCopied(false),1800);}catch(e){}};
  const useImageFile=async(f)=>{if(!f)return;setBusy(true);setErr('');setCard(null);try{const d=await compressImage(f,1400,0.88);setRawImg(d);}catch(err){}setBusy(false);};
  useEffect(()=>{
    const onPaste=(e)=>{const items=e.clipboardData&&e.clipboardData.items;if(!items)return;for(let i=0;i<items.length;i++){const it=items[i];if(it.type&&it.type.indexOf('image')===0){const f=it.getAsFile();if(f){e.preventDefault();useImageFile(f);}return;}}};
    window.addEventListener('paste',onPaste);
    return ()=>window.removeEventListener('paste',onPaste);
  },[]);
  const sortedTrips=[...trips].sort((a,b)=>b.startDate.localeCompare(a.startDate));
  const finalImg=card||rawImg;
  const save=()=>{if(!finalImg)return;onSave({id:'stk-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),img:finalImg,tripId:tripId||null,title:title.trim(),ts:Date.now()});};
  return (
    <div className="scrim" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{width:420}}>
        <div className="mbar"><span>加入明信片</span><button className="x" onClick={onClose}>✕</button></div>
        <div className="mbody">
          <div style={{background:'var(--cream)',padding:'9px 11px',marginBottom:12,fontSize:11.5,color:'var(--ink-soft)',lineHeight:1.75}}>
            在 <b style={{color:'var(--purple)'}}>ChatGPT／Claude</b> 上傳照片＋明信片 prompt 產出後，回這裡 <b style={{color:'var(--purple)'}}>直接貼上 Ctrl+V</b> 或上傳。
            <button className="chipbtn" style={{marginTop:8,display:'block',padding:'4px 11px',fontSize:11}} onClick={copyPrompt}>{copied?'✓ 已複製':'📋 複製明信片 Prompt'}</button>
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={pick}/>
          {!rawImg&&(
            <div className="uploadbox" style={{marginBottom:12}} onClick={()=>fileRef.current.click()}>{busy?'處理中…':'📮 上傳圖片，或直接 Ctrl+V 貼上'}</div>
          )}
          {rawImg&&(
            <div style={{marginBottom:12,textAlign:'center'}}>
              <img className="uploadprev" src={card||rawImg} onClick={()=>fileRef.current.click()} style={{cursor:'pointer'}}/>
              <div style={{fontSize:11,color:'var(--ink-soft)',marginTop:6}}>點圖可重選 · 或再貼上一張覆蓋</div>
            </div>
          )}
          {rawImg&&geminiKey&&(
            <div style={{marginBottom:12}}>
              <button className="btn ghost" style={{width:'100%'}} onClick={generate} disabled={gen}>{gen?'🪄 產生中…':(card?'🔄 用 Gemini 重生成':'🪄 改用 Gemini 生成（備用）')}</button>
              {err&&<div style={{fontSize:11,color:'var(--red)',marginTop:7,lineHeight:1.6}}>⚠ {err}</div>}
            </div>
          )}
          <div className="fld"><label>標示旅程</label>
            <select value={tripId} onChange={e=>setTripId(e.target.value)}>
              <option value="">（不標示）</option>
              {sortedTrips.map(t=><option key={t.id} value={t.id}>{t.location}{t.country?` · ${t.country}`:''}　{fmtRange(t.startDate,t.endDate)}</option>)}
            </select>
          </div>
          <div className="fld"><label>備註（選填）</label><input type="text" value={title} onChange={e=>setTitle(e.target.value)} placeholder="例：晴空塔的夕陽"/></div>
          <div className="mbtns"><button className="btn" onClick={save} disabled={!finalImg}>加入收集冊</button><button className="btn ghost" onClick={onClose}>取消</button></div>
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App(){
  const [loading,setLoading]=useState(true);
  const [trips,setTrips]=useState([]);
  const [year,setYear]=useState(2026);
  const [calStart,setCalStart]=useState(()=>{const n=new Date();let y=n.getFullYear(),m=n.getMonth()-1;if(m<0){m+=12;y--;}return {y,m};});
  const [view,setView]=useState('home');
  const [selId,setSelId]=useState(null);
  const [modal,setModal]=useState(null); // {mode:'create'|'edit', ...}
  const [skin,setSkin]=useState('day');
  const [settingsOpen,setSettingsOpen]=useState(false);
  const changeSkin=(s)=>{setSkin(s);storage.set('skin',s).catch(()=>{});};
  const [stickers,setStickers]=useState([]);
  const [addStk,setAddStk]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  const [geminiKey,setGeminiKey]=useState(()=>{try{return localStorage.getItem('gemini_key')||'';}catch(e){return '';}});
  const saveGeminiKey=(k)=>{setGeminiKey(k);try{k?localStorage.setItem('gemini_key',k):localStorage.removeItem('gemini_key');}catch(e){}};
  const addSticker=(s)=>{const next=[...stickers,s];setStickers(next);saveStickers(next);setAddStk(false);};
  const deleteSticker=(id)=>{const next=stickers.filter(s=>s.id!==id);setStickers(next);saveStickers(next);};
  const shiftCal=(delta)=>{const tot=calStart.y*12+calStart.m+delta;const y=Math.floor(tot/12),m=((tot%12)+12)%12;setCalStart({y,m});setYear(y);};
  const goYear=(ny)=>{setYear(ny);setCalStart({y:ny,m:0});};

  useEffect(()=>{(async()=>{
    const sk=await storage.get('skin').catch(()=>null);if(sk&&sk.value)setSkin(['day','night','airmail','transit','island','journal'].includes(sk.value)?sk.value:'day');
    loadStickers().then(setStickers).catch(()=>{});
    const t=await loadTrips();
    // backfill country / coords from the built-in dictionary (instant)
    let changed=false;
    for(const tr of t){
      if(!tr.country&&CITY_COUNTRY[tr.location]){tr.country=CITY_COUNTRY[tr.location];changed=true;}
      if(typeof tr.lat!=='number'&&LOCATION_COORDS[tr.location]){const c=LOCATION_COORDS[tr.location];tr.lat=c.lat;tr.lng=c.lng;changed=true;}
      // 未手動改色的旅程 → 顏色一律照類別
      if(!tr.colorCustom){const pc=PURPOSE[migratePurpose(tr.purpose)||'overseasLeisure'].color;if(tr.color!==pc){tr.color=pc;changed=true;}}
    }
    setTrips(t);setLoading(false);
    if(changed)saveTrips(t);
    // geocode any trips still missing a country (throttled for Nominatim), then merge
    let geo=false;
    for(const tr of t){
      if(!tr.country&&tr.location){
        try{const g=await geocode(tr.location,'');if(g){if(g.country){tr.country=g.country;geo=true;}if(typeof tr.lat!=='number'&&typeof g.lat==='number'){tr.lat=g.lat;tr.lng=g.lng;geo=true;}}}catch(e){}
        await new Promise(r=>setTimeout(r,1100));
      }
    }
    if(geo)setTrips(prev=>{const byId={};t.forEach(x=>byId[x.id]=x);const merged=prev.map(p=>{const m=byId[p.id];return (m&&!p.country&&m.country)?{...p,country:m.country,lat:(typeof p.lat==='number'?p.lat:m.lat),lng:(typeof p.lng==='number'?p.lng:m.lng)}:p;});saveTrips(merged);return merged;});
  })();},[]);
  const persist=(next)=>{setTrips(next);saveTrips(next);};

  const upcoming=useMemo(()=>{
    const td=todayStr();
    return [...trips].filter(t=>t.endDate>=td).sort((a,b)=>a.startDate.localeCompare(b.startDate));
  },[trips]);
  const nextTrip=upcoming[0]||null;

  const openCreate=(a,b)=>setModal({mode:'edit-obj',initial:{startDate:a,endDate:b}});
  const openTrip=(id)=>{setSelId(id);setView('detail');};
  const selTrip=trips.find(t=>t.id===selId);

  const saveTrip=(trip)=>{
    const exists=trips.some(t=>t.id===trip.id);
    const next=exists?trips.map(t=>t.id===trip.id?trip:t):[...trips,trip];
    persist(next);setModal(null);
  };
  const deleteTrip=(id)=>{persist(trips.filter(t=>t.id!==id));setModal(null);if(selId===id){setSelId(null);setView('home');}};
  const updateTrip=(trip)=>persist(trips.map(t=>t.id===trip.id?trip:t));

  if(loading)return <div className="loading">LOADING…</div>;

  return (
    <div className="app" data-skin={skin}>
      <InkDefs/>
      {view==='home'&&(<>
        <div className="topbar">
          <svg className="logom" viewBox="0 0 40 40" aria-hidden="true"><g filter="url(#inkrough)"><circle cx="20" cy="20" r="17" fill="none" stroke="var(--stamp)" strokeWidth="2.6"/><circle cx="20" cy="20" r="13" fill="none" stroke="var(--stamp)" strokeWidth="1.2"/><path d="M11 24 L29 14 L25 27 L20 23 L17 28 L16 22 Z" fill="var(--stamp)"/></g></svg>
          <div><div className="zh">{year} · {ZODIAC_TC[year]||''}年</div><div className="sub">旅行日誌</div></div>
          <div className="yswitch">
            <button className="arw" onClick={()=>goYear(year-1)}>‹</button>
            <span className="cur en">{year}</span>
            <button className="arw" onClick={()=>goYear(year+1)}>›</button>
          </div>
          <button className="gear" onClick={()=>setSettingsOpen(true)} aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
        </div>

        <Hero nextTrip={nextTrip} skin={skin} year={year}/>

        <div className="sh"><span className="zh">年曆</span><span className="r"/></div>
        <div className="pad">
          <Calendar start={calStart} trips={trips} onCreate={openCreate} onOpenTrip={openTrip} onShift={shiftCal}/>
          <div className="caltip">
            點擊或拖曳日期即可新增旅程，{skin==='island'||skin==='journal'?'圓點':'螢光標記'}代表已排的旅程
          </div>
        </div>

        <div className="sh"><span className="zh">年度回顧</span><span className="r"/></div>
        <div className="pad" style={{paddingBottom:24}}>
          <div className="panel">
            <div className="recapteaser">
              {(()=>{const yt=trips.filter(t=>overlapDays(t,`${year}-01-01`,`${year}-12-31`)>0);const days=yt.reduce((s,t)=>s+overlapDays(t,`${year}-01-01`,`${year}-12-31`),0);const places=yt.reduce((s,t)=>s+Object.values(t.dailyPlaces||{}).reduce((a,l)=>a+l.length,0),0);const cs=new Set(yt.map(t=>t.country||'其他'));return (<>
                <div className="stat"><div className="n">{yt.length}</div><div className="l">旅程段數</div></div>
                <div className="stat"><div className="n">{places}</div><div className="l">造訪地點</div></div>
                <div className="stat"><div className="n">{days}</div><div className="l">在外天數</div></div>
                <div className="stat"><div className="n">{cs.size}</div><div className="l">國家</div></div>
              </>);})()}
              <button className="genbtn" onClick={()=>setView('recap')}>{OWNER} 的 {year} Trips</button>
            </div>
          </div>
        </div>

        <div className="sh"><span className="zh">明信片收集冊</span><span className="r"/></div>
        <div className="pad" style={{paddingBottom:24}}>
          <div className="panel stkteaser" onClick={()=>setView('album')}>
            {stickers.length>0?(
              <div className="stkstrip">{stickers.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,7).map(s=><div className="mini" key={s.id}><img src={s.img} alt=""/></div>)}</div>
            ):(
              <div className="stkteaser-empty">還沒有明信片 · 用明信片 prompt 產出後上傳，收藏你的每一趟 ✦</div>
            )}
            <div className="stkteaser-foot">
              <span className="cnt">{stickers.length} 張明信片</span>
              <button className="genbtn" style={{background:'var(--gold)',color:'var(--ink)'}} onClick={(e)=>{e.stopPropagation();setAddStk(true);}}>＋ 加入明信片</button>
              <span className="enter">進入收集冊 ›</span>
            </div>
          </div>
        </div>

        <div className="foot"><div className="en">© {OWNER} LIN · {year}</div></div>

        <button className="fab" onClick={()=>{const t=todayStr();setModal({mode:'edit-obj',initial:{startDate:t,endDate:t}});}}>＋ 新增旅程</button>
      </>)}

      {view==='detail'&&selTrip&&(
        <Detail trip={selTrip} onBack={()=>{setView('home');setSelId(null);}} onEdit={()=>setModal({mode:'edit-obj',initial:selTrip})} onUpdate={updateTrip}/>
      )}

      {view==='recap'&&(
        <Recap year={year} trips={trips} onBack={()=>setView('home')} onOpenTrip={openTrip}/>
      )}

      {view==='album'&&(
        <StickerAlbum stickers={stickers} trips={trips} onBack={()=>setView('home')} onAdd={()=>setAddStk(true)} onDelete={deleteSticker} onView={setLightbox}/>
      )}

      {addStk&&<AddStickerModal trips={trips} onClose={()=>setAddStk(false)} onSave={addSticker} geminiKey={geminiKey} onNeedKey={()=>{setAddStk(false);setSettingsOpen(true);}}/>}
      {lightbox&&<div className="lightbox" onClick={()=>setLightbox(null)}><img src={lightbox} alt=""/></div>}

      {modal&&(
        <TripModal initial={modal.initial} onClose={()=>setModal(null)} onSave={saveTrip} onDelete={deleteTrip}/>
      )}

      {settingsOpen&&(
        <div className="scrim" onMouseDown={e=>{if(e.target===e.currentTarget)setSettingsOpen(false);}}>
          <div className="modal" style={{width:360}}>
            <div className="mbar"><span>設定</span><button className="x" onClick={()=>setSettingsOpen(false)}>✕</button></div>
            <div className="mbody">
              <div style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10,fontWeight:600}}>外觀（可隨時替換）</div>
              {[['day','方格紙','方格手帳紙、橡皮印章、螢光筆'],['night','夜讀','方格紙的深色版，晚上翻看不刺眼'],['airmail','航空信','紅藍斜紋信封、郵戳、郵票齒孔'],['transit','車站看板','深藍底黃字、翻牌倒數、站名牌'],['island','島嶼旅人','平面插畫、明亮配色'],['journal','手繪日誌','白紙黑墨、手寫感、生肖手繪']].map(([k,name,desc])=>(
                <div key={k} className="skinopt" data-on={skin===k} onClick={()=>changeSkin(k)}>
                  <div><div style={{fontWeight:800,fontSize:15}}>{name}</div><div style={{fontSize:12,color:'var(--ink-soft)',marginTop:2}}>{desc}</div></div>
                  {skin===k&&<span style={{color:'var(--purple)',fontWeight:800,fontSize:13}}>✓ 使用中</span>}
                </div>
              ))}
              <div style={{fontSize:12,color:'var(--ink-soft)',margin:'16px 0 8px',fontWeight:600,borderTop:'1px solid var(--line)',paddingTop:14}}>Gemini API 金鑰（用於網頁端直接產明信片）</div>
              <div className="fld"><input type="password" value={geminiKey} onChange={e=>saveGeminiKey(e.target.value.trim())} placeholder="貼上你的 Google Gemini API 金鑰"/></div>
              <div style={{fontSize:11,color:'var(--ink-soft)',lineHeight:1.7}}>
                {geminiKey?'✓ 已設定（只存在此瀏覽器）':'未設定 · 到 '}
                {!geminiKey&&<a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" style={{color:'var(--purple)',fontWeight:700}}>Google AI Studio</a>}
                {!geminiKey&&' 免費申請'}
                {geminiKey&&<button className="chipbtn" style={{marginLeft:8,padding:'3px 10px',fontSize:11}} onClick={()=>saveGeminiKey('')}>清除</button>}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
